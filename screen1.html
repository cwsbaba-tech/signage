<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 1</title>
<style>
html { margin:0; padding:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
body {
  margin:0; padding:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top;
  position:absolute; top:100vh; left:0;
  overflow:hidden; background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}

/* ==============================
   全体レイアウト：Flexbox 3段
============================== */
#layout {
  width:100%; height:100%;
  display:flex; flex-direction:column;
}

/* ==============================
   固定枠（上）LED掲示板スタイル
============================== */
#bar-top {
  flex-shrink:0;
  background:#050a0f;
  border-bottom:2px solid #00b4d8;
  padding:12px 24px 0;
  z-index:50;
  transition:opacity 0.1s;
}
#bar-info {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:8px;
}
#weather {
  font-size:48px; font-weight:700;
  letter-spacing:0.05em;
}
#ticker-wrap {
  overflow:hidden; height:48px;
  border-top:1px solid #00334d;
  background:#020d14;
  position:relative;
}
#ticker-canvas {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}

/* ==============================
   コンテンツエリア
============================== */
#content {
  flex:1; position:relative; overflow:hidden; background:#000;
}

/* ==============================
   通常スライド（左半分）
============================== */
.slide {
  position:absolute; top:0; left:0;
  width:200%; height:100%;
  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;
  opacity:0;
  transition:opacity 0.5s ease-in-out;
}
.slide.calendar-large {
  width:200% !important;
  background-size:contain !important;
  background-position:38.5% center !important;
}

/* ==============================
   フリーエリア（ケン・バーンズ）
============================== */
#free-container {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  opacity:0; transition:opacity 0.5s ease-in-out;
  overflow:hidden;
}
.kb-slide {
  position:absolute; inset:0;
  background-size:200% 100%;
  background-position:left center;
  opacity:0; transition:opacity 0.8s ease;
}
@keyframes kb-zoom {
  from { transform:scale(1); }
  to   { transform:scale(1.09); }
}
.kb-overlay {
  position:absolute; top:0; left:0; right:0;
  padding:24px 28px 40px;
  background:linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
  pointer-events:none; z-index:5;
}
.kb-label {
  font-size:20px; font-weight:700; letter-spacing:0.35em;
  color:rgba(0,180,216,0.85); margin-bottom:6px;
}
.kb-title {
  font-size:48px; font-weight:700;
  color:#fff; letter-spacing:0.05em;
}

/* ==============================
   固定枠（下・QR）
============================== */
#bar-qr {
  flex-shrink:0;
  background:#050a0f;
  border-top:2px solid #00b4d8;
  padding:10px 32px;
  display:flex; justify-content:center; align-items:center;
  height:96px; z-index:50;
  transition:opacity 0.1s;
}
.qr-item { display:flex; align-items:center; gap:14px; }
.qr-item img {
  width:72px; height:72px;
  border-radius:6px; background:#fff;
  padding:3px; object-fit:contain;
}
.qr-lbl {
  font-size:20px; font-weight:700;
  color:#00b4d8; letter-spacing:0.1em;
}

/* ==============================
   ロゴオーバーレイ
============================== */
#mainOverlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat left center;
  background-size:200% 100%;
  opacity:0; pointer-events:none;
  z-index:100;
}

/* ==============================
   スキャンラインエフェクト用
============================== */
#focuslight {
  position:fixed; top:50%; left:50%;
  width:200vmax; height:200vmax;
  transform:translate(-50%,-50%) scale(0);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(202,240,248,1) 0%,
    rgba(0,180,216,0.85) 18%,
    rgba(0,180,216,0.25) 38%,
    transparent 65%);
  z-index:99; pointer-events:none; opacity:0;
}
@keyframes focus-in {
  0%   { transform:translate(-50%,-50%) scale(0);    opacity:0; }
  35%  { transform:translate(-50%,-50%) scale(0.35); opacity:1; }
  100% { transform:translate(-50%,-50%) scale(1);    opacity:0; }
}
@keyframes focus-out {
  0%   { transform:translate(-50%,-50%) scale(0);    opacity:0; }
  35%  { transform:translate(-50%,-50%) scale(0.3);  opacity:1; }
  100% { transform:translate(-50%,-50%) scale(0.9);  opacity:0; }
}
@keyframes flicker {
  0%,100% { opacity:1; }
  20%     { opacity:0.1; }
  40%     { opacity:0.9; }
  60%     { opacity:0.05; }
  80%     { opacity:0.8; }
}

/* ==============================
   スタート画面
============================== */
#startOverlay {
  position:fixed; inset:0; background:#000; color:#fff;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:4vw; margin-bottom:2vh; color:#00b4d8; }
#startOverlay p  { font-size:2.5vw; opacity:0.7; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 1 (LEFT SIDE)</p>
</div>

<div id="mainOverlay"></div>
<div id="focuslight"></div>

<div id="layout">
  <div id="bar-top">
    <div id="bar-info">
      <span id="weather"></span>
    </div>
    <div id="ticker-wrap">
      <canvas id="ticker-canvas"></canvas>
    </div>
  </div>

  <div id="content">
    <div id="free-container">
      <div class="kb-slide" id="kb0"></div>
      <div class="kb-slide" id="kb1"></div>
      <div class="kb-slide" id="kb2"></div>
      <div class="kb-overlay">
        <div class="kb-label" id="kb-label"></div>
        <div class="kb-title" id="kb-title"></div>
      </div>
    </div>
  </div>

  <div id="bar-qr">
    <div class="qr-item">
      <img src="instagram.jpg" alt="Instagram QR">
      <span class="qr-lbl">Instagram</span>
    </div>
  </div>
</div>

<script>
var CYCLE_MS = 59900;

var PARTS = [
  {
    id:'calendar', type:'image', src:'calendar.jpg',
    offset:0, duration:10000, calendarLarge:true
  },
  {
    id:'free1', type:'free',
    offset:10000, duration:10000,
    images:['free1_01.png','free1_02.png','free1_03.png'],
    labels:['BEFORE','DURING','AFTER'],
    titles:['クリーニング前','クリーニング中','クリーニング完了'],
    durs:[3000,3000,4000]
  },
  {
    id:'holiday', type:'image', src:'holiday.jpg',
    offset:20000, duration:10000
  },
  {
    id:'free2', type:'free',
    offset:30000, duration:10000,
    images:['free2_01.jpg','free2_02.jpg','free2_03.jpg'],
    labels:['STEP 1','STEP 2','STEP 3'],
    titles:['スケッチ','色入れ','完成'],
    durs:[3300,3300,3400]
  },
  {
    id:'event', type:'image', src:'event.jpg',
    offset:40000, duration:10000
  },
  {
    id:'logo', type:'logo',
    offset:50000, duration:9900
  }
];

/* DOM生成 */
var contentEl = document.getElementById('content');
var imageEls  = {};
PARTS.forEach(function(p) {
  if (p.type !== 'image') return;
  var el = document.createElement('div');
  el.className = 'slide';
  if (p.calendarLarge) el.classList.add('calendar-large');
  el.style.backgroundImage = "url('" + p.src + "')";
  contentEl.appendChild(el);
  imageEls[p.id] = el;
});

var overlay       = document.getElementById('mainOverlay');
var focuslight    = document.getElementById('focuslight');
var barTop        = document.getElementById('bar-top');
var barQr         = document.getElementById('bar-qr');
var freeContainer = document.getElementById('free-container');
var kbEls = [
  document.getElementById('kb0'),
  document.getElementById('kb1'),
  document.getElementById('kb2')
];
var kbLabelEl = document.getElementById('kb-label');
var kbTitleEl = document.getElementById('kb-title');

var started     = false;
var lastPartId  = null;
var freeTimer   = null;
var freeRunning = false;

function getPartByOffset(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

/* ==============================
   ロゴ切り替えエフェクト
   1. 固定枠をフリッカーして消す
   2. シアンのスキャンラインが走る
   3. ロゴがフェードイン
============================== */
function playLogoEnter() {
  /* Step1: 固定枠フリッカー → 非表示 */
  barTop.style.animation = 'flicker 0.4s ease forwards';
  barQr.style.animation  = 'flicker 0.4s ease forwards';

  setTimeout(function() {
    barTop.style.display = 'none';
    barQr.style.display  = 'none';
    barTop.style.animation = '';
    barQr.style.animation  = '';

    /* Step2: フォーカスイン（中央から光が広がる） */
    focuslight.style.animation = 'none';
    focuslight.style.opacity   = '0';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        focuslight.style.animation = 'focus-in 0.9s cubic-bezier(0.2,0.8,0.2,1) forwards';
      });
    });

    /* Step3: 光が最大になるタイミングでロゴをフェードイン */
    setTimeout(function() {
      overlay.style.transition = 'opacity 0.6s ease';
      overlay.style.opacity    = '1';
    }, 320);

  }, 400);
}

/* ロゴ → 通常パートへの復帰エフェクト */
function playLogoExit() {
  /* フォーカスアウト（光が中央へ収束して消える） */
  focuslight.style.animation = 'none';
  focuslight.style.opacity   = '0';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      focuslight.style.animation = 'focus-out 0.8s cubic-bezier(0.4,0,0.2,1) forwards';
    });
  });

  overlay.style.transition = 'opacity 0.4s ease';
  overlay.style.opacity    = '0';

  setTimeout(function() {
    barTop.style.display = '';
    barQr.style.display  = '';
    barTop.style.animation = 'flicker 0.3s ease forwards';
    barQr.style.animation  = 'flicker 0.3s ease forwards';
    setTimeout(function() {
      barTop.style.animation = '';
      barQr.style.animation  = '';
    }, 300);
  }, 250);
}

/* ==============================
   フリーエリア制御
============================== */
function startFree(part, partOff) {
  freeRunning = true;
  kbEls.forEach(function(el, i) {
    el.style.backgroundImage = "url('" + part.images[i] + "')";
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
  var elapsed   = partOff;
  var startIdx  = 0;
  var remaining = part.durs[0];
  for (var i = 0; i < part.durs.length; i++) {
    if (elapsed < part.durs[i]) {
      startIdx  = i;
      remaining = part.durs[i] - elapsed;
      break;
    }
    elapsed -= part.durs[i];
  }
  showKbSlide(part, startIdx, remaining);
}

function showKbSlide(part, idx, dur) {
  if (!freeRunning) return;
  kbEls.forEach(function(el, i) {
    if (i !== idx) {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '0';
      el.style.animation  = 'none';
    }
  });
  var el = kbEls[idx];
  el.style.animation = 'none';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '1';
      el.style.animation  = 'kb-zoom ' + (dur/1000).toFixed(2) + 's ease-out forwards';
    });
  });
  kbLabelEl.textContent = part.labels[idx];
  kbTitleEl.textContent = part.titles[idx];
  if (freeTimer) clearTimeout(freeTimer);
  freeTimer = setTimeout(function() {
    var next = idx + 1;
    if (next < part.durs.length && freeRunning) {
      showKbSlide(part, next, part.durs[next]);
    }
  }, dur);
}

function stopFree() {
  freeRunning = false;
  if (freeTimer) { clearTimeout(freeTimer); freeTimer = null; }
  kbEls.forEach(function(el) {
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
}

function hideImageSlides() {
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = '0';
  });
}

/* ==============================
   メインループ
============================== */
var wasLogo = false;

function tick() {
  if (!started) return;
  var offset  = Date.now() % CYCLE_MS;
  var part    = getPartByOffset(offset);
  if (part.id === lastPartId) return;
  lastPartId  = part.id;
  var partOff = offset - part.offset;

  if (part.type === 'logo') {
    stopFree();
    freeContainer.style.opacity = '0';
    hideImageSlides();
    playLogoEnter();
    wasLogo = true;
    return;
  }

  if (wasLogo) {
    wasLogo = false;
    playLogoExit();
  } else {
    overlay.style.transition = '';
    overlay.style.opacity    = '0';
    barTop.style.display = '';
    barQr.style.display  = '';
  }

  if (part.type === 'free') {
    hideImageSlides();
    stopFree();
    freeContainer.style.opacity = '1';
    startFree(part, partOff);
    return;
  }

  stopFree();
  freeContainer.style.opacity = '0';
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}

setInterval(tick, 100);

/* ==============================
   天気（中野区）
============================== */
function fetchWeather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=35.71&longitude=139.66&current_weather=true')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var t    = Math.round(d.current_weather.temperature);
      var code = d.current_weather.weathercode;
      var icon, color;
      if (code <= 1) {        /* 晴れ */
        icon = '☀'; color = '#ffb703';
      } else if (code <= 3) { /* 晴れ時々曇り */
        icon = '⛅'; color = '#ffd166';
      } else if (code <= 45) { /* 曇り・霧 */
        icon = '☁'; color = '#cbd5e1';
      } else if (code <= 67) { /* 雨 */
        icon = '☂'; color = '#90e0ef';
      } else if (code <= 77) { /* 雪 */
        icon = '❄'; color = '#e0fbfc';
      } else {                 /* 雷雨など */
        icon = '⛈'; color = '#a78bfa';
      }
      var weatherEl = document.getElementById('weather');
      weatherEl.textContent = icon + ' ' + t + '°C';
      weatherEl.style.color = color;
    })
    .catch(function() {
      document.getElementById('weather').textContent = '';
    });
}
fetchWeather();
setInterval(fetchWeather, 600000);

/* ==============================
   スタート
============================== */
document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
  initTicker();
  requestAnimationFrame(drawTicker);
});

window.addEventListener('resize', initTicker);

/* ==============================
   テロップ：Canvasで位置計算
   スクリーン2と同じロジック・同じ速度
   スクリーン1なので位置オフセットなし
============================== */
var TICKER_TEXT = 'サイクルセンター山口　自転車の販売・修理・クリーニング　お気軽にご相談ください　　　　　　　　　';
var TICKER_SPEED = 80;
var tickerCanvas = document.getElementById('ticker-canvas');
var tickerCtx    = tickerCanvas.getContext('2d');
var tickerW = 0, tickerH = 0, textW = 0;

function initTicker() {
  tickerW = tickerCanvas.offsetWidth;
  tickerH = tickerCanvas.offsetHeight;
  tickerCanvas.width  = tickerW;
  tickerCanvas.height = tickerH;
  tickerCtx.font = '700 32px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  textW = tickerCtx.measureText(TICKER_TEXT).width;
}

function drawTicker() {
  if (!started) { requestAnimationFrame(drawTicker); return; }
  tickerCtx.clearRect(0, 0, tickerW, tickerH);
  var loopW   = textW + tickerW;
  var elapsed = (Date.now() / 1000) * TICKER_SPEED;
  /* スクリーン1は右端から始まるオフセット0 */
  var pos = elapsed % loopW;
  var x   = tickerW - pos;
  tickerCtx.font         = '700 32px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  tickerCtx.fillStyle    = '#00b4d8';
  tickerCtx.textBaseline = 'middle';
  tickerCtx.fillText(TICKER_TEXT, x, tickerH / 2);
  if (x + textW < tickerW) {
    tickerCtx.fillText(TICKER_TEXT, x + textW, tickerH / 2);
  }
  requestAnimationFrame(drawTicker);
}

</script>
</body>
</html>
