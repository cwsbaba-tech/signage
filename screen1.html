<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 1 IMAGE VERSION</title>

<style>

html{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

body{
  margin:0;
  padding:0;

  width:100vh;
  height:100vw;

  position:absolute;
  top:100vh;
  left:0;

  transform:rotate(-90deg);
  transform-origin:left top;

  overflow:hidden;
  background:#000;
}

/* 通常画像 */

.slide{
  position:fixed;
  top:0;
  left:0;

  width:200%;
  height:100%;

  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;

  opacity:0;

  transition:opacity .5s ease-in-out;

  z-index:10;
}

/* カレンダー特殊表示 */

.slide.calendar-large{
  width:200% !important;
  background-size:contain !important;
  background-position:38.5% center !important;
}

/* ロゴ */

#mainOverlay{
  position:fixed;
  top:0;
  left:0;

  width:100%;
  height:100%;

  background:#fff url('トリックロゴ.jpg') no-repeat left center;
  background-size:200% 100%;

  opacity:0;

  transition:opacity .8s ease;

  z-index:50;

  pointer-events:none;
}

#mainOverlay.visible{
  opacity:1;
}

/* free1 */

#free1Compare,
#free1Full,
#free21,
#free22,
#free23{

  position:fixed;

  top:0;
  left:0;

  width:200%;
  height:100%;

  opacity:0;

  transition:opacity .5s ease;

  z-index:20;
}

#free1Compare{
  display:flex;
}

#free1Compare .left{
  width:50%;
  height:100%;

  background:url('free1_01.jpg') no-repeat center center;
  background-size:cover;
}

#free1Compare .right{
  width:50%;
  height:100%;

  background:url('free1_02.jpg') no-repeat center center;
  background-size:cover;
}

#free1Full{
  background:url('free1_03.jpg') no-repeat left center;
  background-size:100% 100%;
}

/* free2 */

#free21{
  background:url('free2_01.jpg') no-repeat left center;
  background-size:100% 100%;
}

#free22{
  background:url('free2_02.jpg') no-repeat left center;
  background-size:100% 100%;
}

#free23{
  background:url('free2_03.jpg') no-repeat left center;
  background-size:100% 100%;
}

/* スタート */

#startOverlay{
  position:fixed;
  inset:0;

  background:#000;
  color:#fff;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  z-index:9999;
}

</style>
</head>

<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 1 IMAGE VERSION</p>
</div>

<div id="mainOverlay"></div>

<div id="free1Compare">
  <div class="left"></div>
  <div class="right"></div>
</div>

<div id="free1Full"></div>

<div id="free21"></div>
<div id="free22"></div>
<div id="free23"></div>

<script>

var contents = [

  {type:'calendar', duration:10000},

  {type:'free1', duration:10000},

  {type:'holiday', duration:10000},

  {type:'free2', duration:10000},

  {type:'event', duration:10000}

];

var MAIN_MS = 10000;

var ADJUST_MS = 0;

/* 合計50秒 */

var INDIVIDUAL_MS = 0;

contents.forEach(function(c){
  INDIVIDUAL_MS += c.duration;
});

/* +ロゴ10秒 */

var CYCLE_MS = INDIVIDUAL_MS + MAIN_MS;

var overlay = document.getElementById('mainOverlay');

var started = false;

var lastContentIdx = -1;

var offsets = [];

var acc = 0;

contents.forEach(function(c){

  offsets.push(acc);

  acc += c.duration;

});

/* 通常画像 */

var imageMap = {
  calendar:'calendar.jpg',
  holiday:'holiday.jpg',
  event:'event.jpg'
};

var elements = {};

Object.keys(imageMap).forEach(function(key){

  var div = document.createElement('div');

  div.className = 'slide';

  if(key === 'calendar'){
    div.classList.add('calendar-large');
  }

  div.style.backgroundImage =
    "url('" + imageMap[key] + "')";

  document.body.appendChild(div);

  elements[key] = div;

});

function hideAll(){

  Object.keys(elements).forEach(function(k){

    elements[k].style.opacity='0';

  });

  free1Compare.style.opacity='0';
  free1Full.style.opacity='0';

  free21.style.opacity='0';
  free22.style.opacity='0';
  free23.style.opacity='0';

}

var free1Compare =
document.getElementById('free1Compare');

var free1Full =
document.getElementById('free1Full');

var free21 =
document.getElementById('free21');

var free22 =
document.getElementById('free22');

var free23 =
document.getElementById('free23');

function showContent(idx){

  hideAll();

  var c = contents[idx];

  if(c.type === 'calendar'){
    elements.calendar.style.opacity='1';
  }

  else if(c.type === 'holiday'){
    elements.holiday.style.opacity='1';
  }

  else if(c.type === 'event'){
    elements.event.style.opacity='1';
  }

  else if(c.type === 'free1'){

    free1Compare.style.opacity='1';

    setTimeout(function(){

      if(lastContentIdx === idx){

        free1Compare.style.opacity='0';
        free1Full.style.opacity='1';

      }

    },5000);

  }

  else if(c.type === 'free2'){

    free21.style.opacity='1';

    setTimeout(function(){

      if(lastContentIdx === idx){

        free21.style.opacity='0';
        free22.style.opacity='1';

      }

    },3000);

    setTimeout(function(){

      if(lastContentIdx === idx){

        free22.style.opacity='0';
        free23.style.opacity='1';

      }

    },6000);

  }

}

function tick(){

  if(!started) return;

  var now = Date.now() + ADJUST_MS;

  var offset = now % CYCLE_MS;

  var isMain = offset >= INDIVIDUAL_MS;

  if(isMain){

    if(lastContentIdx !== 999){

      lastContentIdx = 999;

      hideAll();

      overlay.classList.add('visible');

    }

  }
  else{

    var idx = 0;

    for(var i=contents.length-1;i>=0;i--){

      if(offset >= offsets[i]){

        idx = i;
        break;

      }

    }

    if(idx !== lastContentIdx){

      overlay.classList.remove('visible');

      lastContentIdx = idx;

      showContent(idx);

    }

  }

}

setInterval(tick,100);

document.getElementById('startOverlay')
.addEventListener('click',function(){

  this.style.display='none';

  ensureFullscreen();

  started = true;

});

function ensureFullscreen(){

  var el = document.documentElement;

  if(el.requestFullscreen){
    el.requestFullscreen();
  }
  else if(el.webkitRequestFullscreen){
    el.webkitRequestFullscreen();
  }

}

</script>

</body>
</html>
