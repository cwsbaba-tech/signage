<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 1</title>
<style>
html { margin:0; padding:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
body {
  margin:0; padding:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top;
  position:absolute; top:100vh; left:0;
  overflow:hidden; background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}

/* ==============================
   全体レイアウト：Flexboxで3段積み
   固定枠上 → コンテンツ → 固定枠下
============================== */
#layout {
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ==============================
   固定枠（上）
============================== */
#bar-top {
  flex-shrink:0;
  background:#111;
  border-bottom:2px solid rgba(255,255,255,0.15);
  padding:14px 24px 8px;
  z-index:50;
}
#bar-info {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
#weather {
  font-size:26px;
  color:rgba(255,255,255,0.9);
  letter-spacing:0.05em;
}
#clock {
  font-size:44px;
  font-weight:200;
  color:#fff;
  letter-spacing:0.12em;
  font-variant-numeric:tabular-nums;
}
#ticker-wrap {
  overflow:hidden;
  height:34px;
  border-top:1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
}
#ticker {
  display:inline-block;
  white-space:nowrap;
  font-size:18px;
  color:rgba(255,255,255,0.75);
  letter-spacing:0.06em;
  animation:ticker 28s linear infinite;
}
@keyframes ticker {
  from { transform:translateX(100vw); }
  to   { transform:translateX(-100%); }
}

/* ==============================
   コンテンツエリア（中段）
   固定枠の高さを除いた残り全部
============================== */
#content {
  flex:1;
  position:relative;
  overflow:hidden;
  background:#000;
}

/* ==============================
   通常スライド
   コンテンツエリア内に収まるよう position:absolute
============================== */
.slide {
  position:absolute;
  top:0; left:0;
  width:200%; height:100%;
  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;
  opacity:0;
  transition:opacity 0.5s ease-in-out;
}
.slide.calendar-large {
  width:200% !important;
  background-size:contain !important;
  background-position:38.5% center !important;
}
.slide.event-full {
  width:100% !important;
  background-size:cover !important;
  background-position:center center !important;
}

/* ==============================
   フリーエリア（ケン・バーンズ）
============================== */
#free-container {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  opacity:0;
  transition:opacity 0.5s ease-in-out;
  overflow:hidden;
}
.kb-slide {
  position:absolute; inset:0;
  background-size:200% 100%;
  background-position:left center;
  opacity:0;
  transition:opacity 0.8s ease;
}
@keyframes kb-zoom {
  from { transform:scale(1); }
  to   { transform:scale(1.09); }
}
.kb-overlay {
  position:absolute;
  bottom:0; left:0; right:0;
  padding:20px 24px 16px;
  background:linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
  pointer-events:none;
  z-index:5;
}
.kb-label {
  font-size:14px;
  letter-spacing:0.3em;
  color:rgba(255,255,255,0.5);
  margin-bottom:4px;
}
.kb-title {
  font-size:22px;
  font-weight:500;
  color:#fff;
  letter-spacing:0.05em;
}

/* ==============================
   固定枠（下・QR）
============================== */
#bar-qr {
  flex-shrink:0;
  background:#111;
  border-top:2px solid rgba(255,255,255,0.15);
  padding:10px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:90px;
  z-index:50;
}
.qr-item {
  display:flex;
  align-items:center;
  gap:12px;
}
.qr-item img {
  width:64px; height:64px;
  border-radius:6px;
  background:#fff;
  padding:3px;
  object-fit:contain;
}
.qr-lbl {
  font-size:15px;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.1em;
}

/* ==============================
   ロゴ（全画面・固定枠なし）
   layoutの上に被せる
============================== */
#mainOverlay {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat left center;
  background-size:200% 100%;
  opacity:0;
  transition:opacity 0.8s ease;
  z-index:100;
  pointer-events:none;
}
#mainOverlay.visible { opacity:1; }

/* ==============================
   スタート画面
============================== */
#startOverlay {
  position:fixed; inset:0;
  background:#000; color:#fff;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:4vw; margin-bottom:2vh; }
#startOverlay p  { font-size:2.5vw; opacity:0.7; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 1 (LEFT SIDE)</p>
</div>

<div id="mainOverlay"></div>

<!-- 3段Flexレイアウト -->
<div id="layout">

  <!-- 上部固定枠 -->
  <div id="bar-top">
    <div id="bar-info">
      <span id="weather"></span>
      <span id="clock">--:--</span>
    </div>
    <div id="ticker-wrap">
      <span id="ticker">サイクルセンター山口　自転車の販売・修理・クリーニング　お気軽にご相談ください　　　　　　　　　</span>
    </div>
  </div>

  <!-- コンテンツエリア -->
  <div id="content">
    <!-- 通常スライドはJSで生成 -->

    <!-- フリーエリア -->
    <div id="free-container">
      <div class="kb-slide" id="kb0"></div>
      <div class="kb-slide" id="kb1"></div>
      <div class="kb-slide" id="kb2"></div>
      <div class="kb-overlay">
        <div class="kb-label" id="kb-label"></div>
        <div class="kb-title" id="kb-title"></div>
      </div>
    </div>
  </div>

  <!-- 下部固定枠（QR） -->
  <div id="bar-qr">
    <div class="qr-item">
      <img src="instagram.jpg" alt="Instagram QR">
      <span class="qr-lbl">Instagram</span>
    </div>
    <div class="qr-item" style="flex-direction:row-reverse">
      <img src="HP.png" alt="HP QR">
      <span class="qr-lbl">ホームページ</span>
    </div>
  </div>

</div>

<script>
/* ============================================================
   CYCLE_MS はスクリーン3に合わせて 59900ms
============================================================ */
var CYCLE_MS = 59900;

/* ============================================================
   パート定義
============================================================ */
var PARTS = [
  {
    id:'calendar', type:'image', src:'calendar.jpg',
    offset:0, duration:10000, calendarLarge:true
  },
  {
    id:'free1', type:'free',
    offset:10000, duration:10000,
    images:['free1_01.png','free1_02.png','free1_03.png'],
    labels:['BEFORE','DURING','AFTER'],
    titles:['クリーニング前','クリーニング中','クリーニング完了'],
    durs:[3000,3000,4000]
  },
  {
    id:'holiday', type:'image', src:'holiday.jpg',
    offset:20000, duration:10000
  },
  {
    id:'free2', type:'free',
    offset:30000, duration:10000,
    images:['free2_01.png','free2_02.png','free2_03.png'],
    labels:['STEP 1','STEP 2','STEP 3'],
    titles:['スケッチ','色入れ','完成'],
    durs:[3300,3300,3400]
  },
  {
    id:'event', type:'image', src:'event.jpg',
    offset:40000, duration:10000,
    eventFull:true
  },
  {
    id:'logo', type:'logo',
    offset:50000, duration:9900
  }
];

/* ============================================================
   DOM生成（通常スライドをcontentの中に追加）
============================================================ */
var contentEl = document.getElementById('content');
var imageEls  = {};

PARTS.forEach(function(p) {
  if (p.type !== 'image') return;
  var el = document.createElement('div');
  el.className = 'slide';
  if (p.calendarLarge) el.classList.add('calendar-large');
  if (p.eventFull)     el.classList.add('event-full');
  el.style.backgroundImage = "url('" + p.src + "')";
  contentEl.appendChild(el);
  imageEls[p.id] = el;
});

/* ============================================================
   要素取得
============================================================ */
var overlay       = document.getElementById('mainOverlay');
var barTop        = document.getElementById('bar-top');
var barQr         = document.getElementById('bar-qr');
var freeContainer = document.getElementById('free-container');
var kbEls = [
  document.getElementById('kb0'),
  document.getElementById('kb1'),
  document.getElementById('kb2')
];
var kbLabelEl = document.getElementById('kb-label');
var kbTitleEl = document.getElementById('kb-title');

/* ============================================================
   状態管理
============================================================ */
var started     = false;
var lastPartId  = null;
var freeTimer   = null;
var freeRunning = false;

/* ============================================================
   パート特定
============================================================ */
function getPartByOffset(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

/* ============================================================
   フリーエリア制御
============================================================ */
function startFree(part, partOff) {
  freeRunning = true;
  kbEls.forEach(function(el, i) {
    el.style.backgroundImage = "url('" + part.images[i] + "')";
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
  var elapsed   = partOff;
  var startIdx  = 0;
  var remaining = part.durs[0];
  for (var i = 0; i < part.durs.length; i++) {
    if (elapsed < part.durs[i]) {
      startIdx  = i;
      remaining = part.durs[i] - elapsed;
      break;
    }
    elapsed -= part.durs[i];
  }
  showKbSlide(part, startIdx, remaining);
}

function showKbSlide(part, idx, dur) {
  if (!freeRunning) return;
  kbEls.forEach(function(el, i) {
    if (i !== idx) {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '0';
      el.style.animation  = 'none';
    }
  });
  var el = kbEls[idx];
  el.style.animation = 'none';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '1';
      el.style.animation  = 'kb-zoom ' + (dur / 1000).toFixed(2) + 's ease-out forwards';
    });
  });
  kbLabelEl.textContent = part.labels[idx];
  kbTitleEl.textContent = part.titles[idx];
  if (freeTimer) clearTimeout(freeTimer);
  freeTimer = setTimeout(function() {
    var next = idx + 1;
    if (next < part.durs.length && freeRunning) {
      showKbSlide(part, next, part.durs[next]);
    }
  }, dur);
}

function stopFree() {
  freeRunning = false;
  if (freeTimer) { clearTimeout(freeTimer); freeTimer = null; }
  kbEls.forEach(function(el) {
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
}

/* ============================================================
   メインループ
============================================================ */
function tick() {
  if (!started) return;
  var offset  = Date.now() % CYCLE_MS;
  var part    = getPartByOffset(offset);
  if (part.id === lastPartId) return;
  lastPartId  = part.id;
  var partOff = offset - part.offset;

  /* ロゴ：固定枠ごと全画面で覆う */
  if (part.type === 'logo') {
    stopFree();
    freeContainer.style.opacity = '0';
    hideImageSlides();
    overlay.classList.add('visible');
    return;
  }

  overlay.classList.remove('visible');

  if (part.type === 'free') {
    hideImageSlides();
    stopFree();
    freeContainer.style.opacity = '1';
    startFree(part, partOff);
    return;
  }

  stopFree();
  freeContainer.style.opacity = '0';
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}

function hideImageSlides() {
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = '0';
  });
}

setInterval(tick, 100);

/* ============================================================
   時計
============================================================ */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 60000);

/* ============================================================
   天気（Open-Meteo・山口市）
============================================================ */
function fetchWeather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=34.18&longitude=131.47&current_weather=true')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var t    = Math.round(d.current_weather.temperature);
      var code = d.current_weather.weathercode;
      var icon = code <= 1  ? '☀' :
                 code <= 3  ? '⛅' :
                 code <= 45 ? '☁' :
                 code <= 67 ? '🌧' : '❄';
      document.getElementById('weather').textContent = icon + ' ' + t + '°C';
    })
    .catch(function() {
      document.getElementById('weather').textContent = '';
    });
}
fetchWeather();
setInterval(fetchWeather, 600000);

/* ============================================================
   スタート
============================================================ */
document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
});
</script>
</body>
</html>
