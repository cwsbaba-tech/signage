<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 1</title>
<style>
html { margin:0; padding:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
body {
  margin:0; padding:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top;
  position:absolute; top:100vh; left:0;
  overflow:hidden; background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}

/* ==============================
   全体レイアウト：Flexbox 3段
============================== */
#layout {
  width:100%; height:100%;
  display:flex; flex-direction:column;
}

/* ==============================
   固定枠（上）LED掲示板スタイル
============================== */
#bar-top {
  flex-shrink:0;
  background:#050a0f;
  border-bottom:2px solid #00b4d8;
  padding:18px 24px;
  z-index:50;
  transition:opacity 0.1s;
}
#bar-info {
  display:flex; justify-content:space-between; align-items:center;
  gap:12px;
}
#date-area {
  display:flex; flex-direction:row; align-items:baseline;
  gap:10px;
}
#date-str {
  font-size:44px; font-weight:700;
  color:#caf0f8; letter-spacing:0.05em;
  font-variant-numeric:tabular-nums;
}
#day-str {
  font-size:36px; font-weight:700;
  letter-spacing:0.1em;
}
#weather {
  display:flex; align-items:center; gap:10px;
  font-size:48px; font-weight:700;
  letter-spacing:0.05em;
}

/* ==============================
   コンテンツエリア
============================== */
#content {
  flex:1; position:relative; overflow:hidden; background:#000;
}

/* ==============================
   通常スライド（左半分）
============================== */
.slide {
  position:absolute; top:0; left:0;
  width:200%; height:100%;
  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;
  opacity:0;
  -webkit-transition:opacity 0.5s ease-in-out;
  transition:opacity 0.5s ease-in-out;
}
.slide.calendar-large {
  width:200% !important;
  background-size:100% 100% !important;
  background-position:center center !important;
}

/* ==============================
   フリーエリア（ケン・バーンズ）
============================== */
#free-container {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  opacity:0; transition:opacity 0.5s ease-in-out;
  overflow:hidden;
}
.kb-slide {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background-size:200% 100%;
  background-position:left center;
  opacity:0;
  -webkit-transition:opacity 0.8s ease;
  transition:opacity 0.8s ease;
}
@keyframes kb-zoom {
  from { transform:scale(1); }
  to   { transform:scale(1.09); }
}
.kb-overlay {
  position:absolute; top:28px; left:0; right:0;
  padding:0 28px;
  pointer-events:none; z-index:5;
  overflow:hidden;
}
.kb-label {
  display:inline-block;
  font-size:22px; font-weight:700; letter-spacing:0.35em;
  color:#00b4d8;
  text-shadow:
    2px  2px 0 #000,
   -2px  2px 0 #000,
    2px -2px 0 #000,
   -2px -2px 0 #000;
  margin-bottom:6px;
  transform:translateX(-110%);
  opacity:0;
}
.kb-title {
  display:block;
  font-size:56px; font-weight:700; letter-spacing:0.05em;
  color:#fff;
  text-shadow:
    3px  3px 0 #000,
   -3px  3px 0 #000,
    3px -3px 0 #000,
   -3px -3px 0 #000,
    4px  4px 6px rgba(0,0,0,0.6);
  transform:translateX(-110%);
  opacity:0;
}
@keyframes slide-in-label {
  0%   { transform:translateX(-110%); opacity:0; }
  100% { transform:translateX(0);     opacity:1; }
}
@keyframes slide-in-title {
  0%   { transform:translateX(-110%); opacity:0; }
  100% { transform:translateX(0);     opacity:1; }
}

/* ==============================
   固定枠（下・QR）
============================== */
#bar-qr {
  flex-shrink:0;
  background:#050a0f;
  z-index:50;
  transition:opacity 0.1s;
  position:relative;
}
#bar-qr-line {
  width:100%;
  height:3px;
  background-color:#00b4d8;
  display:block;
}
#qr-row {
  padding:10px 32px;
  display:flex; justify-content:center; align-items:center;
  height:96px;
}
#ticker-wrap {
  overflow:hidden; height:64px;
  border-bottom:1px solid #00334d;
  background:#020d14;
  position:relative;
}
#ticker-canvas {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
.qr-item { display:flex; align-items:center; gap:14px; }
.qr-item img {
  width:72px; height:72px;
  border-radius:6px; background:#fff;
  padding:3px; object-fit:contain;
}
.qr-lbl {
  font-size:20px; font-weight:700;
  color:#00b4d8; letter-spacing:0.1em;
}

/* ==============================
   ロゴオーバーレイ
============================== */
#mainOverlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat left center;
  background-size:200% 100%;
  opacity:0; pointer-events:none;
  z-index:100;
}

/* ==============================
   スキャンラインエフェクト用
============================== */
/* 画面全体を覆う白（先に消える＝周辺から先に見える） */
#focuslight {
  position:fixed; inset:0;
  background:#fff;
  z-index:101; pointer-events:none; opacity:0;
}
/* 中心だけ白が残るレイヤー（後から消える＝中心は最後に見える） */
#focuslight-center {
  position:fixed; inset:0;
  background:radial-gradient(circle, #fff 0%, #fff 38%, transparent 72%);
  z-index:102; pointer-events:none; opacity:0;
}
@keyframes flicker {
  0%,100% { opacity:1; }
  20%     { opacity:0.1; }
  40%     { opacity:0.9; }
  60%     { opacity:0.05; }
  80%     { opacity:0.8; }
}

/* ==============================
   スタート画面
============================== */
#startOverlay {
  position:fixed; inset:0; background:#000; color:#fff;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:4vw; margin-bottom:2vh; color:#00b4d8; }
#startOverlay p  { font-size:2.5vw; opacity:0.7; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 1 (LEFT SIDE)</p>
</div>

<div id="mainOverlay"></div>
<div id="focuslight"></div>
<div id="focuslight-center"></div>

<div id="layout">
  <div id="bar-top">
    <div id="bar-info">
      <div id="date-area">
        <span id="date-str">--/--</span>
        <span id="day-str">---</span>
      </div>
      <span id="weather"><span id="weather-icon"></span> <span id="weather-temp"></span></span>
    </div>
  </div>

  <div id="content">
    <div id="free-container">
      <div class="kb-slide" id="kb0"></div>
      <div class="kb-slide" id="kb1"></div>
      <div class="kb-slide" id="kb2"></div>
      <div class="kb-overlay">
        <div class="kb-label" id="kb-label"></div>
        <div class="kb-title" id="kb-title"></div>
      </div>
    </div>
  </div>

  <div id="bar-qr">
    <div id="bar-qr-line"></div>
    <div id="ticker-wrap">
      <canvas id="ticker-canvas"></canvas>
    </div>
    <div id="qr-row">
      <div class="qr-item">
        <img src="instagram.jpg" alt="Instagram QR">
        <span class="qr-lbl">Instagram</span>
      </div>
    </div>
  </div>
</div>

<script>
var CYCLE_MS = 59900;

var PARTS = [
  {
    id:'calendar', type:'image', src:'calendar.jpg',
    offset:0, duration:10000, calendarLarge:true
  },
  {
    id:'free1', type:'free',
    offset:10000, duration:10000,
    images:['free1_01.png','free1_02.png','free1_03.png'],
    labels:['BEFORE','DURING','AFTER'],
    titles:['クリーニング前','クリーニング中','クリーニング完了'],
    durs:[3000,3000,4000]
  },
  {
    id:'holiday', type:'image', src:'holiday.jpg',
    offset:20000, duration:10000
  },
  {
    id:'free2', type:'free',
    offset:30000, duration:10000,
    images:['free2_01.jpg','free2_02.jpg','free2_03.jpg'],
    labels:['STEP 1','STEP 2','STEP 3'],
    titles:['スケッチ','色入れ','完成'],
    durs:[3300,3300,3400]
  },
  {
    id:'event', type:'image', src:'event.jpg',
    offset:40000, duration:10000
  },
  {
    id:'logo', type:'logo',
    offset:50000, duration:9900
  }
];

/* ============================================================
   外部TXTファイルからテロップ・ラベルを読み込む
   （HTMLを編集せず以下のファイルを書き換えるだけで反映される）

   ticker.txt        : テロップ本文（1行）
   free1_labels.txt  : フリー1のラベル・タイトル（3行 "ラベル|タイトル"）
   free2_labels.txt  : フリー2のラベル・タイトル（3行 "ラベル|タイトル"）
============================================================ */
function loadTextFile(path) {
  return fetch(path, { cache: 'no-cache' })
    .then(function(r) { if (!r.ok) throw new Error('not found'); return r.text(); })
    .catch(function() { return null; });
}

function applyFreeLabels(partId, text) {
  var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); })
                   .filter(function(l){ return l.length > 0; });
  var part = PARTS.find(function(p){ return p.id === partId; });
  if (!part) return;
  var labels = [], titles = [];
  lines.forEach(function(line) {
    var sep = line.indexOf('|');
    if (sep === -1) { labels.push(''); titles.push(line); }
    else { labels.push(line.slice(0, sep).trim()); titles.push(line.slice(sep + 1).trim()); }
  });
  if (labels.length === part.labels.length) {
    part.labels = labels;
    part.titles = titles;
  }
}

function loadConfig() {
  Promise.all([
    loadTextFile('ticker.txt'),
    loadTextFile('free1_labels.txt'),
    loadTextFile('free2_labels.txt')
  ]).then(function(results) {
    var tickerTxt = results[0];
    if (tickerTxt) {
      var line = tickerTxt.split(/\r?\n/).map(function(l){return l.trim();})
                           .filter(function(l){return l.length>0;}).join('　');
      if (line) {
        TICKER_TEXT = line + '　　　　　　　　　';
        if (tickerW) textW = tickerCtx.measureText(TICKER_TEXT).width;
      }
    }
    if (results[1]) applyFreeLabels('free1', results[1]);
    if (results[2]) applyFreeLabels('free2', results[2]);
  });
}
loadConfig();

/* DOM生成 */
var contentEl = document.getElementById('content');
var imageEls  = {};
PARTS.forEach(function(p) {
  if (p.type !== 'image') return;
  var el = document.createElement('div');
  el.className = 'slide';
  if (p.calendarLarge) el.classList.add('calendar-large');
  el.style.backgroundImage = "url('" + p.src + "')";
  contentEl.appendChild(el);
  imageEls[p.id] = el;
});

var overlay       = document.getElementById('mainOverlay');
var focuslight       = document.getElementById('focuslight');
var focuslightCenter = document.getElementById('focuslight-center');
var barTop        = document.getElementById('bar-top');
var barQr         = document.getElementById('bar-qr');
var freeContainer = document.getElementById('free-container');
var kbEls = [
  document.getElementById('kb0'),
  document.getElementById('kb1'),
  document.getElementById('kb2')
];
var kbLabelEl = document.getElementById('kb-label');
var kbTitleEl = document.getElementById('kb-title');

var started     = false;
var lastPartId  = null;
var freeTimer   = null;
var freeRunning = false;

function getPartByOffset(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

/* ==============================
   ロゴ切り替えエフェクト
   1. 固定枠をフリッカーして消す
   2. シアンのスキャンラインが走る
   3. ロゴがフェードイン
============================== */
function playLogoEnter() {
  /* Step1: 固定枠フリッカー → 非表示 */
  barTop.style.animation = 'flicker 0.4s ease forwards';
  barQr.style.animation  = 'flicker 0.4s ease forwards';

  setTimeout(function() {
    barTop.style.display = 'none';
    barQr.style.display  = 'none';
    barTop.style.animation = '';
    barQr.style.animation  = '';

    /* Step2: 一旦画面全体を真っ白に（ここで両画面のズレを吸収する） */
    focuslight.style.transition       = 'none';
    focuslightCenter.style.transition = 'none';
    focuslight.style.opacity          = '1';
    focuslightCenter.style.opacity    = '1';

    /* ロゴはこの白の下に先に表示しておく */
    overlay.style.transition = 'none';
    overlay.style.opacity    = '1';

    /* Step3: 真っ白を少し保持してから、
       周辺 → 中心 の順にゆっくり消えてロゴが浮かび上がる */
    setTimeout(function() {
      focuslight.style.transition = 'opacity 0.8s ease-in';
      focuslight.style.opacity    = '0';

      setTimeout(function() {
        focuslightCenter.style.transition = 'opacity 0.8s ease-in';
        focuslightCenter.style.opacity    = '0';
      }, 250);

    }, 350);

  }, 400);
}

/* ロゴ → 通常パートへの復帰エフェクト */
function playLogoExit() {
  /* エフェクトなし：ロゴを即時に消して固定枠を戻す */
  overlay.style.transition = '';
  overlay.style.opacity    = '0';
  barTop.style.display = '';
  barQr.style.display  = '';
}

/* ==============================
   フリーエリア制御
============================== */
function startFree(part, partOff) {
  freeRunning = true;
  kbEls.forEach(function(el, i) {
    el.style.backgroundImage = "url('" + part.images[i] + "')";
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
  var elapsed   = partOff;
  var startIdx  = 0;
  var remaining = part.durs[0];
  for (var i = 0; i < part.durs.length; i++) {
    if (elapsed < part.durs[i]) {
      startIdx  = i;
      remaining = part.durs[i] - elapsed;
      break;
    }
    elapsed -= part.durs[i];
  }
  showKbSlide(part, startIdx, remaining);
}

function showKbSlide(part, idx, dur) {
  if (!freeRunning) return;
  kbEls.forEach(function(el, i) {
    if (i !== idx) {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '0';
      el.style.animation  = 'none';
    }
  });
  var el = kbEls[idx];
  el.style.animation = 'none';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      el.style.transition = 'opacity 0.8s ease';
      el.style.opacity    = '1';
      el.style.animation  = 'kb-zoom ' + (dur/1000).toFixed(2) + 's ease-out forwards';
    });
  });
  kbLabelEl.textContent = part.labels[idx];
  kbTitleEl.textContent = part.titles[idx];

  /* テキストを一旦リセットしてからスライドイン */
  kbLabelEl.style.animation = 'none';
  kbTitleEl.style.animation = 'none';
  kbLabelEl.style.opacity   = '0';
  kbTitleEl.style.opacity   = '0';
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      kbLabelEl.style.animation = 'slide-in-label 0.5s cubic-bezier(0.2,0.8,0.2,1) 0.3s forwards';
      kbTitleEl.style.animation = 'slide-in-title 0.5s cubic-bezier(0.2,0.8,0.2,1) 0.5s forwards';
    });
  });
  if (freeTimer) clearTimeout(freeTimer);
  freeTimer = setTimeout(function() {
    var next = idx + 1;
    if (next < part.durs.length && freeRunning) {
      showKbSlide(part, next, part.durs[next]);
    }
  }, dur);
}

function stopFree() {
  freeRunning = false;
  if (freeTimer) { clearTimeout(freeTimer); freeTimer = null; }
  kbEls.forEach(function(el) {
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
  kbLabelEl.style.animation = 'none';
  kbTitleEl.style.animation = 'none';
  kbLabelEl.style.opacity   = '0';
  kbTitleEl.style.opacity   = '0';
}

function hideImageSlides() {
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = '0';
  });
}

/* ==============================
   メインループ
============================== */
var wasLogo = false;

function tick() {
  if (!started) return;
  var offset  = Date.now() % CYCLE_MS;
  var part    = getPartByOffset(offset);
  if (part.id === lastPartId) return;
  lastPartId  = part.id;
  var partOff = offset - part.offset;

  if (part.type === 'logo') {
    stopFree();
    freeContainer.style.opacity = '0';
    hideImageSlides();
    playLogoEnter();
    wasLogo = true;
    return;
  }

  if (wasLogo) {
    wasLogo = false;
    playLogoExit();
  } else {
    overlay.style.transition = '';
    overlay.style.opacity    = '0';
    barTop.style.display = '';
    barQr.style.display  = '';
  }

  if (part.type === 'free') {
    hideImageSlides();
    stopFree();
    freeContainer.style.opacity = '1';
    startFree(part, partOff);
    return;
  }

  stopFree();
  freeContainer.style.opacity = '0';
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}

setInterval(tick, 100);

/* ==============================
   日付・曜日
============================== */
var DAY_JA = ['日','月','火','水','木','金','土'];

function updateDate() {
  try {
    var now  = new Date();
    var m    = now.getMonth() + 1;
    var d    = now.getDate();
    var day  = DAY_JA[now.getDay()];
    document.getElementById('date-str').textContent = m + '/' + d;
    document.getElementById('day-str').textContent  = '(' + day + ')';
    /* 曜日で色を変える：土=青、日=赤、平日=薄白 */
    var dayColor = now.getDay() === 0 ? '#ef476f'
                 : now.getDay() === 6 ? '#4cc9f0'
                 : '#ffffff';
    document.getElementById('day-str').style.color = dayColor;
  } catch(e) {}
}
updateDate();
setInterval(updateDate, 60000);

/* ==============================
   天気（中野区）
============================== */
/* ==============================
   天気（完全独立・失敗しても他に影響しない）
   5分ごとに更新。失敗時は前回値を維持。
============================== */
function fetchWeather() {
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, 8000); /* 8秒でタイムアウト */
  fetch(
    'https://api.open-meteo.com/v1/forecast?latitude=35.71&longitude=139.66&current_weather=true',
    { signal: controller.signal }
  )
  .then(function(r) {
    clearTimeout(timer);
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  })
  .then(function(d) {
    var t    = Math.round(d.current_weather.temperature);
    var code = d.current_weather.weathercode;
    var icon, iconColor;
    if      (code <= 1)  { icon = '☀'; iconColor = '#ffb703'; }
    else if (code <= 3)  { icon = '⛅'; iconColor = '#ffd166'; }
    else if (code <= 45) { icon = '☁'; iconColor = '#cbd5e1'; }
    else if (code <= 67) { icon = '☂'; iconColor = '#90e0ef'; }
    else if (code <= 77) { icon = '❄'; iconColor = '#e0fbfc'; }
    else                 { icon = '⛈'; iconColor = '#a78bfa'; }
    var tempColor;
    if      (t <= 0)  tempColor = '#90e0ef';
    else if (t <= 10) tempColor = '#48cae4';
    else if (t <= 20) tempColor = '#52d68a';
    else if (t <= 28) tempColor = '#ffd166';
    else if (t <= 33) tempColor = '#ff9f1c';
    else              tempColor = '#ef476f';
    var iconEl = document.getElementById('weather-icon');
    var tempEl = document.getElementById('weather-temp');
    if (iconEl) { iconEl.textContent = icon; iconEl.style.color = iconColor; }
    if (tempEl) { tempEl.textContent = t + '°C'; tempEl.style.color = tempColor; }
  })
  .catch(function() {
    clearTimeout(timer);
    /* 失敗時は前回値を維持・何もしない */
  });
}
/* 起動直後の1回目：ページ読み込み完了後に実行 */
setTimeout(fetchWeather, 500);
/* 5分ごとに更新 */
setInterval(fetchWeather, 300000);

/* ==============================
   スタート
============================== */
document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
  initTicker();
  requestAnimationFrame(drawTicker);
});

window.addEventListener('resize', initTicker);

/* ==============================
   テロップ：Canvasで位置計算
   スクリーン2と同じロジック・同じ速度
   スクリーン1なので位置オフセットなし
============================== */
var TICKER_TEXT = 'サイクルセンター山口　自転車の販売・修理・クリーニング　お気軽にご相談ください　　　　　　　　　';
var TICKER_SPEED = 80;
var tickerCanvas = document.getElementById('ticker-canvas');
var tickerCtx    = tickerCanvas.getContext('2d');
var tickerW = 0, tickerH = 0, textW = 0;

function initTicker() {
  tickerW = tickerCanvas.offsetWidth;
  tickerH = tickerCanvas.offsetHeight;
  tickerCanvas.width  = tickerW;
  tickerCanvas.height = tickerH;
  tickerCtx.font = '700 48px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  textW = tickerCtx.measureText(TICKER_TEXT).width;
}

function drawTicker() {
  if (!started) { requestAnimationFrame(drawTicker); return; }
  tickerCtx.clearRect(0, 0, tickerW, tickerH);
  var loopW   = textW + tickerW;
  var elapsed = (Date.now() / 1000) * TICKER_SPEED;
  /* スクリーン1は右端から始まるオフセット0 */
  var pos = elapsed % loopW;
  var x   = tickerW - pos;
  tickerCtx.font         = '700 48px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  tickerCtx.fillStyle    = '#00b4d8';
  tickerCtx.textBaseline = 'middle';
  tickerCtx.fillText(TICKER_TEXT, x, tickerH / 2);
  if (x + textW < tickerW) {
    tickerCtx.fillText(TICKER_TEXT, x + textW, tickerH / 2);
  }
  requestAnimationFrame(drawTicker);
}

</script>
</body>
</html>
