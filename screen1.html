<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 1</title>
<style>
html { margin:0; padding:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
body {
  margin:0; padding:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top;
  position:absolute; top:100vh; left:0;
  overflow:hidden; background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}

/* ==============================
   固定枠（上）
============================== */
#bar-top {
  position:fixed; top:0; left:0; width:100%; z-index:50;
  background:rgba(0,0,0,0.82);
  border-bottom:0.5px solid rgba(255,255,255,0.1);
  padding:8px 16px 0;
}
#bar-info {
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:5px;
}
#weather { font-size:13px; color:rgba(255,255,255,0.8); letter-spacing:0.05em; }
#clock   { font-size:20px; font-weight:300; color:#fff; letter-spacing:0.1em; font-variant-numeric:tabular-nums; }
#ticker-wrap {
  overflow:hidden; height:20px;
  border-top:0.5px solid rgba(255,255,255,0.07);
}
#ticker {
  display:inline-block; white-space:nowrap;
  font-size:11px; color:rgba(255,255,255,0.65); letter-spacing:0.05em;
  animation:ticker 25s linear infinite;
  padding-top:2px;
}
@keyframes ticker { from{transform:translateX(100vw)} to{transform:translateX(-100%)} }

/* ==============================
   固定枠（下・QR）
============================== */
#bar-qr {
  position:fixed; bottom:0; left:0; width:100%; z-index:50;
  background:rgba(0,0,0,0.85);
  border-top:0.5px solid rgba(255,255,255,0.1);
  padding:6px 20px;
  display:flex; justify-content:space-between; align-items:center;
}
.qr-item { display:flex; align-items:center; gap:7px; }
.qr-item img {
  width:44px; height:44px;
  border-radius:3px; background:#fff;
  padding:2px; object-fit:contain;
}
.qr-lbl { font-size:9px; color:rgba(255,255,255,0.45); letter-spacing:0.1em; }

/* ==============================
   通常スライド（calendar / holiday / event）
============================== */
.slide {
  position:fixed; top:0; left:0; width:200%; height:100%;
  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;
  opacity:0;
  transition:opacity 0.5s ease-in-out;
  z-index:10;
}
.slide.calendar-large {
  width:200% !important;
  background-size:contain !important;
  background-position:38.5% center !important;
}

/* ==============================
   フリーエリア（ケン・バーンズ）
============================== */
#free-container {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:10; opacity:0;
  transition:opacity 0.5s ease-in-out;
  overflow:hidden;
}
.kb-slide {
  position:absolute; inset:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity 0.8s ease;
  /* ケン・バーンズはJS側でanimation付与 */
}
@keyframes kb-zoom {
  from { transform:scale(1);    transform-origin:center center; }
  to   { transform:scale(1.09); transform-origin:center center; }
}

/* オーバーレイテキスト */
.kb-overlay {
  position:absolute; bottom:0; left:0; right:0;
  padding:16px 18px 12px;
  background:linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
  pointer-events:none; z-index:5;
}
.kb-label {
  font-size:10px; letter-spacing:0.25em;
  color:rgba(255,255,255,0.45); margin-bottom:2px;
}
.kb-title {
  font-size:15px; font-weight:500; color:#fff; letter-spacing:0.04em;
}

/* ==============================
   ロゴオーバーレイ（全画面・固定枠なし）
============================== */
#mainOverlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat left center;
  background-size:200% 100%;
  opacity:0;
  transition:opacity 0.8s ease;
  z-index:20; pointer-events:none;
}
#mainOverlay.visible { opacity:1; }

/* ==============================
   スタート画面
============================== */
#startOverlay {
  position:fixed; inset:0; background:#000; color:#fff;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
</style>
</head>
<body>

<!-- スタート -->
<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 1 (LEFT SIDE)</p>
</div>

<!-- ロゴオーバーレイ -->
<div id="mainOverlay"></div>

<!-- 上部固定枠 -->
<div id="bar-top">
  <div id="bar-info">
    <span id="weather"></span>
    <span id="clock">--:--</span>
  </div>
  <div id="ticker-wrap">
    <span id="ticker">サイクルセンター山口　自転車の販売・修理　お気軽にご相談ください　　　　　　　　　</span>
  </div>
</div>

<!-- 下部固定枠（QR） -->
<div id="bar-qr">
  <div class="qr-item">
    <img src="instagram.jpg" alt="Instagram QR">
    <span class="qr-lbl">Instagram</span>
  </div>
  <div class="qr-item" style="flex-direction:row-reverse">
    <img src="HP.png" alt="HP QR">
    <span class="qr-lbl">ホームページ</span>
  </div>
</div>

<!-- フリーエリアコンテナ（フリー1・フリー2共用） -->
<div id="free-container">
  <div class="kb-slide" id="kb0"></div>
  <div class="kb-slide" id="kb1"></div>
  <div class="kb-slide" id="kb2"></div>
  <div class="kb-overlay">
    <div class="kb-label" id="kb-label"></div>
    <div class="kb-title" id="kb-title"></div>
  </div>
</div>

<script>
/* ============================================================
   サイクル設定
   各パートは10秒。合計60秒でループ。
   順番：カレンダー→フリー1→店休日→フリー2→イベント→ロゴ
============================================================ */
var PART_MS  = 10000;
var CYCLE_MS = PART_MS * 6; /* 60秒 */

/* ============================================================
   通常スライド定義
   type:'image' のみ（videoは廃止）
   freeX パートはJS内でケン・バーンズ制御
============================================================ */
var PARTS = [
  { id:'calendar', type:'image',  src:'calendar.jpg',  calendarLarge:true  },
  { id:'free1',    type:'free',   images:['free1_01.png','free1_02.png','free1_03.png'],
    labels:['BEFORE','DURING','AFTER'],
    titles:['クリーニング前','クリーニング中','クリーニング完了'],
    durs:[3000,3000,4000] },
  { id:'holiday',  type:'image',  src:'holiday.jpg'  },
  { id:'free2',    type:'free',   images:['free2_01.png','free2_02.png','free2_03.png'],
    labels:['STEP 1','STEP 2','STEP 3'],
    titles:['スケッチ','色入れ','完成'],
    durs:[3300,3300,3400] },
  { id:'event',    type:'image',  src:'event.jpg'    },
  { id:'logo',     type:'logo'   }
];

/* ============================================================
   DOM生成（通常スライド）
============================================================ */
var imageEls = {}; /* id -> element */

PARTS.forEach(function(p) {
  if (p.type !== 'image') return;
  var el = document.createElement('div');
  el.className = 'slide';
  if (p.calendarLarge) el.classList.add('calendar-large');
  el.style.backgroundImage = "url('" + p.src + "')";
  document.body.appendChild(el);
  imageEls[p.id] = el;
});

/* ============================================================
   フリーエリア制御
============================================================ */
var freeContainer = document.getElementById('free-container');
var kbEls = [
  document.getElementById('kb0'),
  document.getElementById('kb1'),
  document.getElementById('kb2')
];
var kbLabel = document.getElementById('kb-label');
var kbTitle = document.getElementById('kb-title');

var freeActive    = false;   /* フリーエリア表示中か */
var freePartId    = null;    /* 'free1' or 'free2' */
var freeSlideIdx  = -1;      /* 現在のスライド番号 */
var freeTimer     = null;

function startFree(partId, offsetMs) {
  /* 既に同じパートが動いていれば何もしない */
  if (freeActive && freePartId === partId) return;

  freeActive   = true;
  freePartId   = partId;
  freeSlideIdx = -1;
  if (freeTimer) clearTimeout(freeTimer);

  var part = PARTS.find(function(p){ return p.id === partId; });

  /* 画像をセット */
  kbEls.forEach(function(el, i) {
    el.style.backgroundImage = "url('" + part.images[i] + "')";
    el.style.opacity = '0';
    el.style.animation = 'none';
  });

  /* offsetMs からどのスライドの途中か計算 */
  var elapsed = offsetMs;
  var startIdx = 0;
  var remaining = part.durs[0];
  for (var i = 0; i < part.durs.length; i++) {
    if (elapsed < part.durs[i]) {
      startIdx  = i;
      remaining = part.durs[i] - elapsed;
      break;
    }
    elapsed -= part.durs[i];
  }

  showKbSlide(part, startIdx, remaining);
}

function showKbSlide(part, idx, dur) {
  freeSlideIdx = idx;

  /* 前のスライドを隠す */
  kbEls.forEach(function(el, i) {
    if (i !== idx) {
      el.style.opacity = '0';
      el.style.animation = 'none';
    }
  });

  /* 現在のスライドを表示＋ケン・バーンズ */
  var el = kbEls[idx];
  el.style.animation = 'none';
  /* アニメーションリセットのための1フレーム待ち */
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      el.style.animation = 'kb-zoom ' + (dur / 1000) + 's ease-out forwards';
      el.style.opacity   = '1';
    });
  });

  /* オーバーレイテキスト */
  kbLabel.textContent = part.labels[idx];
  kbTitle.textContent = part.titles[idx];

  /* 次のスライドへ */
  freeTimer = setTimeout(function() {
    var next = idx + 1;
    if (next < part.durs.length) {
      showKbSlide(part, next, part.durs[next]);
    }
    /* 最後のスライドはタイムアウトしてもそのまま（tick側でパート切替を管理） */
  }, dur);
}

function stopFree() {
  if (!freeActive) return;
  freeActive = false;
  freePartId = null;
  if (freeTimer) { clearTimeout(freeTimer); freeTimer = null; }
  kbEls.forEach(function(el) {
    el.style.opacity   = '0';
    el.style.animation = 'none';
  });
  freeContainer.style.opacity = '0';
}

/* ============================================================
   メインループ（既存コードの tick 相当）
============================================================ */
var overlay  = document.getElementById('mainOverlay');
var barTop   = document.getElementById('bar-top');
var barQr    = document.getElementById('bar-qr');
var started  = false;
var lastPartId = null;

function tick() {
  if (!started) return;

  var offset  = Date.now() % CYCLE_MS;           /* 0〜59999 */
  var partIdx = Math.floor(offset / PART_MS);    /* 0〜5 */
  var partOff = offset % PART_MS;               /* パート内の経過ms */
  var part    = PARTS[partIdx];

  if (part.id === lastPartId) return; /* 変化なし */
  lastPartId = part.id;

  /* --- ロゴパート --- */
  if (part.type === 'logo') {
    hideAll();
    overlay.classList.add('visible');
    barTop.style.display = 'none';
    barQr.style.display  = 'none';
    return;
  }

  /* --- 固定枠を戻す --- */
  overlay.classList.remove('visible');
  barTop.style.display = '';
  barQr.style.display  = '';

  /* --- フリーパート --- */
  if (part.type === 'free') {
    hideImageSlides();
    freeContainer.style.opacity = '1';
    startFree(part.id, partOff);
    return;
  }

  /* --- 通常画像パート --- */
  stopFree();
  freeContainer.style.opacity = '0';
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}

function hideAll() {
  stopFree();
  freeContainer.style.opacity = '0';
  hideImageSlides();
}

function hideImageSlides() {
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = '0';
  });
}

setInterval(tick, 100);

/* ============================================================
   時計
============================================================ */
function updateClock() {
  var now = new Date();
  var h = String(now.getHours()).padStart(2,'0');
  var m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 10000);

/* ============================================================
   天気（Open-Meteo 無料API・山口市）
============================================================ */
function fetchWeather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=34.18&longitude=131.47&current_weather=true')
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var t    = Math.round(d.current_weather.temperature);
      var code = d.current_weather.weathercode;
      var icon = code <= 1  ? '☀' :
                 code <= 3  ? '⛅' :
                 code <= 45 ? '☁' :
                 code <= 67 ? '🌧' : '❄';
      document.getElementById('weather').textContent = icon + ' ' + t + '°C';
    })
    .catch(function(){ document.getElementById('weather').textContent = ''; });
}
fetchWeather();
setInterval(fetchWeather, 600000);

/* ============================================================
   スタート
============================================================ */
document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)       el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
});
</script>
</body>
</html>
