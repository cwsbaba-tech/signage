<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREEN 2</title>
<style>
html{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
body{
  margin:0;
  padding:0;
  position:fixed;
  width:100vh;
  height:100vw;
  top:100vh;
  left:0;
  overflow:hidden;
  background:#000;
  transform:rotate(-90deg);
  transform-origin:left top;
}
.slide{
  position:fixed;
  top:0;
  left:-100%;
  width:200%;
  height:100%;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover; /* 比率を保って大画面表示 */
  opacity:0;
  transition:opacity 0s; /* 同期のため一瞬で切り替え */
}

/* ★ 右画面用のカレンダー巨大化＆継ぎ目回避設定 */
.slide.calendar-large {
  left: -100% !important;
  width: 200% !important;
  background-size: contain !important; /* カレンダーの上下が切れないように収める */
  /* 位置の微調整：58%にすることで、中央の継ぎ目を水曜日の右側の線に合わせ、文字カケを防ぎます */
  background-position: 58% center !important; 
}

#mainOverlay{
  position:fixed;
  inset:0;
  background:
    #fff
    url('四角ロゴ.PNG')
    no-repeat
    right center;
  background-size:200% auto;
  opacity:0;
  transition:opacity 0s; 
  z-index:20;
  pointer-events:none;
}
#mainOverlay.visible{
  opacity:1;
}
#startOverlay{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
  font-family:sans-serif;
}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 2 (RIGHT SIDE)</p>
</div>
<div id="mainOverlay"></div>

<script>
// 再生したい静止画リスト（10秒ずつ固定）
const contents = [
  {src:'calendar.jpg'}, // 0秒〜10秒
  {src:'holiday.jpg'},  // 10秒〜20秒
  {src:'event.jpg'}     // 20秒〜30秒
  // 30秒〜40秒は自動的に「ロゴ（mainOverlay）」が表示されます
];

const CYCLE_MS = 40000; // 全体で40秒の固定サイクル
const ADJUST_MS = 50;

const overlay = document.getElementById('mainOverlay');
let started = false;
let lastContentIdx = -1;

// divスライドを生成
const elements = contents.map((c, idx) => {
  const el = document.createElement('div');
  el.className = 'slide';
  
  // カレンダー画像（0番目）に特大＆位置調整クラスを付与
  if(idx === 0) {
    el.classList.add('calendar-large');
  }
  
  el.style.backgroundImage = `url('${c.src}')`;
  document.body.appendChild(el);
  return el;
});

function showContent(idx){
  elements.forEach((el, i) => {
    if(i === idx){
      el.style.opacity = '1';
    }else{
      el.style.opacity = '0';
    }
  });
}

function tick(){
  if(!started) return;
  const now = Date.now() + ADJUST_MS;
  const offset = now % CYCLE_MS; // 現在の時間が40秒のサイクルのどこにいるか

  // 完全固定の時間軸で判定（各10秒）
  if (offset >= 30000) {
    // 30秒〜40秒の間は一律で「ロゴ」
    if(lastContentIdx !== 999){
      lastContentIdx = 999;
      elements.forEach(el => { el.style.opacity = '0'; });
      overlay.classList.add('visible');
    }
  } else {
    // 0〜30秒の間は、10秒ごとにインデックスを計算 (0, 1, 2)
    let idx = Math.floor(offset / 10000);
    
    if(idx !== lastContentIdx){
      overlay.classList.remove('visible');
      lastContentIdx = idx;
      showContent(idx);
    }
  }
}

setInterval(tick, 100);

document.getElementById('startOverlay').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  ensureFullscreen();
  started = true;
});

function ensureFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
</script>
</body>
</html>
