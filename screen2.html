<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREEN 2</title>
<style>
html{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
body{
  margin:0;
  padding:0;
  position:fixed;
  width:100vh;
  height:100vw;
  top:100vh;
  left:0;
  overflow:hidden;
  background:#000;
  transform:rotate(-90deg);
  transform-origin:left top;
}
.slide{
  position:fixed;
  top:0;
  left:-100%;
  width:200%;
  height:100%;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:100% 100%;
  opacity:0;
  transition:opacity .3s ease-in-out;
  z-index: 10; /* ★重要：重ね順を明示して裏に隠れるのを防ぐ */
}
video{
  position:fixed;
  top:0;
  left:-100%;
  width:200%;
  height:100%;
  object-fit:fill;
  opacity:0;
  transition:opacity .3s ease-in-out;
  z-index: 10; /* ★重要：重ね順を明示して裏に隠れるのを防ぐ */
}

/* ★ 右画面用のAIカレンダー巨大化＆継ぎ目（水曜日カケ）回避設定 */
.slide.calendar-large {
  left: -100% !important;
  width: 200% !important;
  background-size: contain !important; /* 上下が切れないように収める */
  /* 位置を58%にすることで、真ん中の継ぎ目が「水曜と木曜の区切り線」になり、文字が絶対に欠けません */
  background-position: 58% center !important; 
}

#mainOverlay{
  position:fixed;
  inset:0;
  background:
    #fff
    url('四角ロゴ.PNG')
    no-repeat
    right center;
  background-size:200% auto;
  opacity:0;
  transition:opacity .5s ease;
  z-index:20; /* スライドより常に上に配置 */
  pointer-events:none;
}
#mainOverlay.visible{
  opacity:1;
}
#startOverlay{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
  font-family:sans-serif;
}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 2 (RIGHT SIDE)</p>
</div>
<div id="mainOverlay"></div>

<script>
// 元の順番・秒数を完全に維持（合計59.9秒のサイクル）
const contents = [
  {type:'video', src:'video1.mp4', duration:9900},
  {type:'image', src:'calendar.jpg', duration:10000},
  {type:'video', src:'video2.mp4', duration:10000},
  {type:'image', src:'holiday.jpg', duration:10000},
  {type:'image', src:'event.jpg', duration:10000}
];

const MAIN_MS = 10000; // 最後のロゴ表示時間（10秒）
const ADJUST_MS = 50;

let INDIVIDUAL_MS = 0;
contents.forEach(c => { INDIVIDUAL_MS += c.duration; });
const CYCLE_MS = INDIVIDUAL_MS + MAIN_MS;

const overlay = document.getElementById('mainOverlay');
let started = false;
let lastContentIdx = -1;

const offsets = [];
let acc = 0;
contents.forEach(c => { offsets.push(acc); acc += c.duration; });

// 要素の生成
const elements = contents.map((c, idx) => {
  let el;
  if(c.type === 'video'){
    el = document.createElement('video');
    el.src = c.src;
    el.muted = true;
    el.preload = 'auto';
    el.setAttribute('muted','');
    el.setAttribute('playsinline','');
  }else{
    el = document.createElement('div');
    el.className = 'slide';
    
    // カレンダー（配列の1番目）に特大化＆継ぎ目回避設定を適用
    if(idx === 1) {
      el.classList.add('calendar-large');
    }
    
    el.style.backgroundImage = `url('${c.src}')`;
  }
  document.body.appendChild(el);
  return el;
});

// 表示のコントロール処理（高精度シーク追従型）
function showContent(idx, currentOffset){
  elements.forEach((el, i) => {
    if(i === idx){
      el.style.opacity = '1';
      if(el.tagName === 'VIDEO'){
        // ★最重要：現在の時間軸上の位置（秒）を計算し、動画の再生位置を強制同期
        const videoProgressSec = (currentOffset - offsets[i]) / 1000;
        
        // Androidのフリーズを防ぐため、ズレが0.3秒以上ある時だけ再生位置を瞬間移動（シーク）させる
        if(Math.abs(el.currentTime - videoProgressSec) > 0.3) {
          el.currentTime = videoProgressSec;
        }
        if(el.paused) {
          el.play().catch(()=>{});
        }
      }
    }else{
      el.style.opacity = '0';
      if(el.tagName === 'VIDEO'){
        el.pause();
      }
    }
  });
}

function tick(){
  if(!started) return;
  const now = Date.now() + ADJUST_MS;
  const offset = now % CYCLE_MS;
  const isMain = offset >= INDIVIDUAL_MS;

  if(isMain){
    if(lastContentIdx !== 999){
      lastContentIdx = 999;
      elements.forEach(el => {
        el.style.opacity = '0';
        if(el.tagName === 'VIDEO'){ el.pause(); }
      });
      overlay.classList.add('visible');
    }
  }else{
    let idx = 0;
    for(let i = contents.length - 1; i >= 0; i--){
      if(offset >= offsets[i]){ idx = i; break; }
    }
    
    // ★動画の再生位置を常時監視・微調整するため、インデックスが変わっていなくても毎回showContentを呼び出す仕様に変更
    overlay.classList.remove('visible');
    lastContentIdx = idx;
    showContent(idx, offset);
  }
}

// チェックの頻度を100msから30ms（高精度）に引き上げ、ミリ秒単位のズレを即座に補正
setInterval(tick, 30);

document.getElementById('startOverlay').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  ensureFullscreen();
  started = true;
});

function ensureFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
</script>
</body>
</html>
