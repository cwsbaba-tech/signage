<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREEN 2</title>
<style>
html{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
body{
  margin:0;
  padding:0;
  position:fixed;
  width:100vh;
  height:100vw;
  top:100vh;
  left:0;
  overflow:hidden;
  background:#000;
  transform:rotate(-90deg);
  transform-origin:left top;
}
.slide{
  position:fixed;
  top:0;
  left:-100%;
  width:200%;
  height:100%;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  opacity:0;
  transition:opacity 0s; /* 同期ズレを防ぐため一瞬で切り替え */
}

/* ★ カレンダーが2画面で大きく綺麗に繋がるための右画面用設定 */
.slide.calendar-large {
  left: -100% !important;
  width: 200% !important;
  background-size: contain !important;
  background-position: 58% center !important; /* 継ぎ目で水曜日が切れない位置 */
}

#mainOverlay{
  position:fixed;
  inset:0;
  background:
    #fff
    url('四角ロゴ.PNG')
    no-repeat
    right center;
  background-size:200% auto;
  opacity:0;
  transition:opacity 0s; 
  z-index:20;
  pointer-events:none;
}
#mainOverlay.visible{
  opacity:1;
}
#startOverlay{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
  font-family:sans-serif;
}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 2 (RIGHT SIDE)</p>
</div>
<div id="mainOverlay"></div>

<script>
// ★ 10秒×4枚 ＝ 計40秒の静止画リスト。最後の10秒（計50秒）はロゴになります。
// 元動画の枠だった部分（0秒〜、20秒〜）はお好きな画像名に書き換えてください。
const contents = [
  {src:'bike1.jpg', duration:10000},    // 0〜10秒：元video1の代わり（自転車写真など）
  {src:'calendar.jpg', duration:10000}, // 10〜20秒：カレンダー（2画面大画面表示）
  {src:'bike2.jpg', duration:10000},    // 20〜30秒：元video2の代わり（おすすめ商品など）
  {src:'event.jpg', duration:10000}     // 30〜40秒：ヘルメット助成金POP
  // 40〜50秒：自動的にロゴ（mainOverlay）が表示されます
];

const MAIN_MS = 10000; // ロゴの表示時間（10秒）
const ADJUST_MS = 50;

let INDIVIDUAL_MS = 0;
contents.forEach(c => { INDIVIDUAL_MS += c.duration; });
const CYCLE_MS = INDIVIDUAL_MS + MAIN_MS; // 40000 + 10000 = 50000ms（50秒）に固定されます

const overlay = document.getElementById('mainOverlay');
let started = false;
let lastContentIdx = -1;

const offsets = [];
let acc = 0;
contents.forEach(c => { offsets.push(acc); acc += c.duration; });

// すべてdivスライドとして生成
const elements = contents.map((c, idx) => {
  const el = document.createElement('div');
  el.className = 'slide';
  
  // 配列の1番目（calendar.jpg）に大画面＆継ぎ目回避クラスを適用
  if(idx === 1) {
    el.classList.add('calendar-large');
  }
  
  el.style.backgroundImage = `url('${c.src}')`;
  document.body.appendChild(el);
  return el;
});

function showContent(idx){
  elements.forEach((el, i) => {
    if(i === idx){
      el.style.opacity = '1';
    }else{
      el.style.opacity = '0';
    }
  });
}

function tick(){
  if(!started) return;
  const now = Date.now() + ADJUST_MS;
  const offset = now % CYCLE_MS;
  const isMain = offset >= INDIVIDUAL_MS;

  if(isMain){
    if(lastContentIdx !== 999){
      lastContentIdx = 999;
      elements.forEach(el => { el.style.opacity = '0'; });
      overlay.classList.add('visible');
    }
  }else{
    let idx = 0;
    for(let i = contents.length - 1; i >= 0; i--){
      if(offset >= offsets[i]){ idx = i; break; }
    }
    if(idx !== lastContentIdx){
      overlay.classList.remove('visible');
      lastContentIdx = idx;
      showContent(idx);
    }
  }
}

setInterval(tick, 100);

document.getElementById('startOverlay').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  ensureFullscreen();
  started = true;
});

function ensureFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
</script>
</body>
</html>
