<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREEN 2</title>
<style>
html{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}
body{
  margin:0;
  padding:0;
  position:fixed;
  width:100vh;
  height:100vw;
  top:100vh;
  left:0;
  overflow:hidden;
  background:#000;
  transform:rotate(-90deg);
  transform-origin:left top;
}
.slide{
  position:fixed;
  top:0;
  left:-100%;
  width:200%;
  height:100%;
  background-repeat:no-repeat;
  background-position:center center;
  /* ★ 100% 100%からcoverに変更：ヘルメットPOPが比率を保ったままドカンと大画面になります */
  background-size:cover; 
  opacity:0;
  /* ★ 同期ズレを徹底排除するため、あえて0秒（パッと切り替わる）に設定。もしフェードが欲しければ .3s 等にしてください */
  transition:opacity 0s; 
}

/* ★ カレンダー（2枚目のスライド）だけは継ぎ目を避けるため、右画面の中に収める特殊設定 */
.slide.calendar-fix {
  left: 0 !important;
  width: 100% !important;
  background-size: contain !important; /* 全体が入るように縮小表示 */
}

#mainOverlay{
  position:fixed;
  inset:0;
  background:
    #fff
    url('四角ロゴ.PNG')
    no-repeat
    right center;
  background-size:200% auto;
  opacity:0;
  transition:opacity 0s; /* 同期のため0秒に統一 */
  z-index:20;
  pointer-events:none;
}
#mainOverlay.visible{
  opacity:1;
}
#startOverlay{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  cursor:pointer;
  font-family:sans-serif;
}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 2 (RIGHT SIDE)</p>
</div>
<div id="mainOverlay"></div>

<script>
// すべて静止画（image）で統一し、各10秒（10000ms）に設定
const contents = [
  {type:'image', src:'calendar.jpg', duration:10000}, // スライド2：カレンダー＆店休日補足
  {type:'image', src:'holiday.jpg', duration:10000},  // スライド4：元動画の代わり（イチオシ自転車など）
  {type:'image', src:'event.jpg', duration:10000}    // スライド5：ヘルメット助成金POP
];

const MAIN_MS = 10000; // ロゴの表示時間（10秒）
const ADJUST_MS = 50;

let INDIVIDUAL_MS = 0;
contents.forEach(c => { INDIVIDUAL_MS += c.duration; });
const CYCLE_MS = INDIVIDUAL_MS + MAIN_MS; // 合計40秒のサイクル

const overlay = document.getElementById('mainOverlay');
let started = false;
let lastContentIdx = -1;

const offsets = [];
let acc = 0;
contents.forEach(c => { offsets.push(acc); acc += c.duration; });

// video要素の生成を廃止し、すべてdivスライドとして生成
const elements = contents.map((c, idx) => {
  const el = document.createElement('div');
  el.className = 'slide';
  
  // もしカレンダー（配列の0番目）なら、継ぎ目回避用の特別クラスを付与
  if(idx === 0) {
    el.classList.add('calendar-fix');
  }
  
  el.style.backgroundImage = `url('${c.src}')`;
  document.body.appendChild(el);
  return el;
});

function showContent(idx){
  elements.forEach((el, i) => {
    if(i === idx){
      el.style.opacity = '1';
    }else{
      el.style.opacity = '0';
    }
  });
}

function tick(){
  if(!started) return;
  const now = Date.now() + ADJUST_MS;
  const offset = now % CYCLE_MS;
  const isMain = offset >= INDIVIDUAL_MS;

  if(isMain){
    if(lastContentIdx !== 999){
      lastContentIdx = 999;
      elements.forEach(el => { el.style.opacity = '0'; });
      overlay.classList.add('visible');
    }
  }else{
    let idx = 0;
    for(let i = contents.length - 1; i >= 0; i--){
      if(offset >= offsets[i]){ idx = i; break; }
    }
    if(idx !== lastContentIdx){
      overlay.classList.remove('visible');
      lastContentIdx = idx;
      showContent(idx);
    }
  }
}

setInterval(tick, 100);

document.getElementById('startOverlay').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  ensureFullscreen();
  started = true;
});

function ensureFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
</script>
</body>
</html>
