<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 2</title>
<style>
html { margin:0; padding:0; width:100vw; height:100vh; background:#000; overflow:hidden; }
body {
  margin:0; padding:0; width:100vh; height:100vw;
  transform:rotate(-90deg); transform-origin:left top;
  position:absolute; top:100vh; left:0;
  overflow:hidden; background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}
#layout {
  width:100%; height:100%;
  display:flex; flex-direction:column;
}

/* 上部固定枠 */
#bar-top {
  flex-shrink:0;
  background:#050a0f;
  border-bottom:2px solid #00b4d8;
  padding:12px 24px 0;
  z-index:50;
}
#bar-info {
  display:flex; justify-content:flex-end; align-items:center;
  margin-bottom:8px;
}
#clock {
  font-size:48px; font-weight:700;
  color:#caf0f8; letter-spacing:0.12em;
  font-variant-numeric:tabular-nums;
}
#ticker-wrap {
  overflow:hidden; height:48px;
  border-top:1px solid #00334d;
  background:#020d14;
  position:relative;
}
#ticker-canvas {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}

/* コンテンツエリア */
#content {
  flex:1; position:relative; overflow:hidden; background:#000;
}

/*
  右半分表示の仕組み：
  画像は width:200% で2画面分の幅を持つ。
  left:-100% でコンテナ外左にはみ出させることで
  右半分だけがコンテナ内に見える。
*/
.slide {
  position:absolute;
  top:0; left:-100%;    /* 左に1画面幅ずらして右半分を表示 */
  width:200%; height:100%;
  background-repeat:no-repeat;
  background-position:left center;
  background-size:100% 100%;
  opacity:0;
  transition:opacity 0.5s ease-in-out;
}
.slide.calendar-large {
  background-size:contain !important;
  background-position:38.5% center !important;
}

/* フリーエリア（ケン・バーンズ・右半分） */
#free-container {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  opacity:0; transition:opacity 0.5s ease-in-out;
  overflow:hidden;
}
.kb-slide {
  position:absolute;
  top:0; left:-100%;    /* 同じく右半分を表示 */
  width:200%; height:100%;
  background-size:100% 100%;
  background-position:left center;
  opacity:0; transition:opacity 0.8s ease;
}
@keyframes kb-zoom {
  from { transform:scale(1); }
  to   { transform:scale(1.09); }
}

/* 下部固定枠 */
#bar-qr {
  flex-shrink:0;
  background:#050a0f;
  border-top:2px solid #00b4d8;
  padding:10px 32px;
  display:flex; justify-content:center; align-items:center;
  height:96px; z-index:50;
}
.qr-item { display:flex; align-items:center; gap:14px; }
.qr-item img {
  width:72px; height:72px;
  border-radius:6px; background:#fff;
  padding:3px; object-fit:contain;
}
.qr-lbl {
  font-size:20px; font-weight:700;
  color:#00b4d8; letter-spacing:0.1em;
}

/* ロゴオーバーレイ（右半分） */
#mainOverlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat right center;
  background-size:200% 100%;
  opacity:0; pointer-events:none; z-index:100;
}

/* スキャンライン */
#focuslight {
  position:fixed; inset:0;
  background:#fff;
  z-index:101; pointer-events:none; opacity:0;
}
@keyframes white-flash {
  0%   { opacity:0; }
  12%  { opacity:1; }
  100% { opacity:0; }
}
@keyframes flicker {
  0%,100% { opacity:1; }
  20%     { opacity:0.1; }
  40%     { opacity:0.9; }
  60%     { opacity:0.05; }
  80%     { opacity:0.8; }
}

/* スタート画面 */
#startOverlay {
  position:fixed; inset:0; background:#000; color:#fff;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:4vw; margin-bottom:2vh; color:#00b4d8; }
#startOverlay p  { font-size:2.5vw; opacity:0.7; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 2 (RIGHT SIDE)</p>
</div>
<div id="mainOverlay"></div>
<div id="focuslight"></div>

<div id="layout">
  <div id="bar-top">
    <div id="bar-info">
      <span id="clock">--:--</span>
    </div>
    <div id="ticker-wrap">
      <canvas id="ticker-canvas"></canvas>
    </div>
  </div>

  <div id="content">
    <div id="free-container">
      <div class="kb-slide" id="kb0"></div>
      <div class="kb-slide" id="kb1"></div>
      <div class="kb-slide" id="kb2"></div>
    </div>
  </div>

  <div id="bar-qr">
    <div class="qr-item">
      <img src="HP.png" alt="HP QR">
      <span class="qr-lbl">ホームページ</span>
    </div>
  </div>
</div>

<script>
var CYCLE_MS = 59900;

var PARTS = [
  { id:'calendar', type:'image', src:'calendar.jpg',  offset:0,     duration:10000, calendarLarge:true },
  { id:'free1',    type:'free',  offset:10000, duration:10000,
    images:['free1_01.png','free1_02.png','free1_03.png'],
    labels:['BEFORE','DURING','AFTER'],
    titles:['クリーニング前','クリーニング中','クリーニング完了'],
    durs:[3000,3000,4000] },
  { id:'holiday',  type:'image', src:'holiday.jpg',   offset:20000, duration:10000 },
  { id:'free2',    type:'free',  offset:30000, duration:10000,
    images:['free2_01.jpg','free2_02.jpg','free2_03.jpg'],
    labels:['STEP 1','STEP 2','STEP 3'],
    titles:['スケッチ','色入れ','完成'],
    durs:[3300,3300,3400] },
  { id:'event',    type:'image', src:'event.jpg',     offset:40000, duration:10000 },
  { id:'logo',     type:'logo',                       offset:50000, duration:9900  }
];

/* DOM生成 */
var contentEl = document.getElementById('content');
var imageEls  = {};
PARTS.forEach(function(p) {
  if (p.type !== 'image') return;
  var el = document.createElement('div');
  el.className = 'slide';
  if (p.calendarLarge) el.classList.add('calendar-large');
  el.style.backgroundImage = "url('" + p.src + "')";
  contentEl.appendChild(el);
  imageEls[p.id] = el;
});

var overlay       = document.getElementById('mainOverlay');
var focuslight    = document.getElementById('focuslight');
var barTop        = document.getElementById('bar-top');
var barQr         = document.getElementById('bar-qr');
var freeContainer = document.getElementById('free-container');
var kbEls         = [document.getElementById('kb0'), document.getElementById('kb1'), document.getElementById('kb2')];

var started = false, lastPartId = null, freeTimer = null, freeRunning = false, wasLogo = false;

function getPartByOffset(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

/* ==============================
   テロップ（Canvas・クロススクリーン）
   スクリーン1は x = tickerW - pos
   スクリーン2はその1画面分左 → x = -pos
   両画面とも同じ Date.now() を基準にするため同期する
============================== */
var TICKER_TEXT  = 'サイクルセンター山口　自転車の販売・修理・クリーニング　お気軽にご相談ください　　　　　　　　　';
var TICKER_SPEED = 80; /* px/秒　screen1と同じ値 */
var tickerCanvas = document.getElementById('ticker-canvas');
var tickerCtx    = tickerCanvas.getContext('2d');
var tickerW = 0, tickerH = 0, textW = 0;

function initTicker() {
  tickerW = tickerCanvas.offsetWidth;
  tickerH = tickerCanvas.offsetHeight;
  tickerCanvas.width  = tickerW;
  tickerCanvas.height = tickerH;
  tickerCtx.font = '700 32px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  textW = tickerCtx.measureText(TICKER_TEXT).width;
}

function drawTicker() {
  if (!started) { requestAnimationFrame(drawTicker); return; }
  tickerCtx.clearRect(0, 0, tickerW, tickerH);
  var loopW   = textW + tickerW;
  var elapsed = (Date.now() / 1000) * TICKER_SPEED;
  var pos = elapsed % loopW;
  var x   = -pos; /* スクリーン1(x=tickerW-pos)より1画面分左 */
  tickerCtx.font         = '700 32px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  tickerCtx.fillStyle    = '#00b4d8';
  tickerCtx.textBaseline = 'middle';
  tickerCtx.fillText(TICKER_TEXT, x, tickerH / 2);
  if (x + textW < tickerW) {
    tickerCtx.fillText(TICKER_TEXT, x + textW, tickerH / 2);
  }
  if (x + textW * 2 < tickerW) {
    tickerCtx.fillText(TICKER_TEXT, x + textW * 2, tickerH / 2);
  }
  requestAnimationFrame(drawTicker);
}

/* ロゴエフェクト */
function playLogoEnter() {
  barTop.style.animation = 'flicker 0.4s ease forwards';
  barQr.style.animation  = 'flicker 0.4s ease forwards';
  setTimeout(function() {
    barTop.style.display = 'none'; barQr.style.display = 'none';
    barTop.style.animation = ''; barQr.style.animation = '';
    focuslight.style.animation = 'none'; focuslight.style.opacity = '0';
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      focuslight.style.animation = 'white-flash 0.9s ease-out forwards';
    }); });
    setTimeout(function() {
      overlay.style.transition = 'none';
      overlay.style.opacity = '1';
    }, 110);
  }, 400);
}

function playLogoExit() {
  /* エフェクトなし：ロゴを即時に消して固定枠を戻す */
  overlay.style.transition = '';
  overlay.style.opacity    = '0';
  barTop.style.display = '';
  barQr.style.display  = '';
}

/* フリーエリア */
function startFree(part, partOff) {
  freeRunning = true;
  kbEls.forEach(function(el, i) {
    el.style.backgroundImage = "url('" + part.images[i] + "')";
    el.style.opacity = '0'; el.style.animation = 'none';
  });
  var elapsed = partOff, startIdx = 0, remaining = part.durs[0];
  for (var i = 0; i < part.durs.length; i++) {
    if (elapsed < part.durs[i]) { startIdx = i; remaining = part.durs[i] - elapsed; break; }
    elapsed -= part.durs[i];
  }
  showKbSlide(part, startIdx, remaining);
}

function showKbSlide(part, idx, dur) {
  if (!freeRunning) return;
  kbEls.forEach(function(el, i) {
    if (i !== idx) { el.style.transition = 'opacity 0.8s ease'; el.style.opacity = '0'; el.style.animation = 'none'; }
  });
  var el = kbEls[idx];
  el.style.animation = 'none';
  requestAnimationFrame(function() { requestAnimationFrame(function() {
    el.style.transition = 'opacity 0.8s ease';
    el.style.opacity    = '1';
    el.style.animation  = 'kb-zoom ' + (dur/1000).toFixed(2) + 's ease-out forwards';
  }); });
  if (freeTimer) clearTimeout(freeTimer);
  freeTimer = setTimeout(function() {
    var next = idx + 1;
    if (next < part.durs.length && freeRunning) showKbSlide(part, next, part.durs[next]);
  }, dur);
}

function stopFree() {
  freeRunning = false;
  if (freeTimer) { clearTimeout(freeTimer); freeTimer = null; }
  kbEls.forEach(function(el) { el.style.opacity = '0'; el.style.animation = 'none'; });
}

function hideImageSlides() {
  Object.keys(imageEls).forEach(function(id) { imageEls[id].style.opacity = '0'; });
}

function tick() {
  if (!started) return;
  var offset = Date.now() % CYCLE_MS;
  var part   = getPartByOffset(offset);
  if (part.id === lastPartId) return;
  lastPartId = part.id;
  var partOff = offset - part.offset;

  if (part.type === 'logo') {
    stopFree(); freeContainer.style.opacity = '0'; hideImageSlides();
    playLogoEnter(); wasLogo = true; return;
  }
  if (wasLogo) { wasLogo = false; playLogoExit(); }
  else { overlay.style.transition = ''; overlay.style.opacity = '0'; barTop.style.display = ''; barQr.style.display = ''; }

  if (part.type === 'free') {
    hideImageSlides(); stopFree();
    freeContainer.style.opacity = '1'; startFree(part, partOff); return;
  }
  stopFree(); freeContainer.style.opacity = '0';
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}

setInterval(tick, 100);

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateClock();
setInterval(updateClock, 30000);

document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
  initTicker();
  requestAnimationFrame(drawTicker);
});
window.addEventListener('resize', initTicker);
</script>
</body>
</html>
