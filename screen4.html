<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 4 - ENTRANCE</title>
<style>
html, body {
  margin:0; padding:0;
  width:100%; height:100%;
  background:#000;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  overflow:hidden;
}
#layout {
  width:100%; height:100%;
  display:flex; flex-direction:column;
}

/* 上部固定枠 */
#bar-top {
  flex-shrink:0;
  background:#050a0f;
  border-bottom:2px solid #00b4d8;
  padding:18px 24px;
  z-index:50;
  transition:opacity 0.1s;
}
#bar-info {
  display:flex; justify-content:space-between; align-items:center;
}
#date-area {
  display:flex; flex-direction:row; align-items:baseline;
  gap:10px;
}
#date-str {
  font-size:44px; font-weight:700;
  color:#caf0f8; letter-spacing:0.05em;
  font-variant-numeric:tabular-nums;
}
#day-str {
  font-size:36px; font-weight:700;
  letter-spacing:0.1em;
}
#clock {
  font-size:48px; font-weight:700;
  color:#caf0f8; letter-spacing:0.12em;
  font-variant-numeric:tabular-nums;
}

/* コンテンツエリア */
#content {
  flex:1; position:relative; overflow:hidden; background:#000;
}
.slide {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.5s ease-in-out;
  transition:opacity 0.5s ease-in-out;
}
.video-slide {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  opacity:0;
  -webkit-transition:opacity 0.5s ease-in-out;
  transition:opacity 0.5s ease-in-out;
}
.video-slide video {
  width:100%; height:100%;
  object-fit:cover;
}

/* ==============================
   顔検知割り込み動画レイヤー
   通常コンテンツの上に重なる
============================== */
#welcome-layer {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  z-index:30;
  opacity:0;
  pointer-events:none;
  -webkit-transition:opacity 0.6s ease;
  transition:opacity 0.6s ease;
  background:#000;
}
#welcome-layer.active { opacity:1; }
#welcome-video {
  width:100%; height:100%;
  object-fit:cover;
}

/* カメラプレビュー（非表示・検知用のみ） */
#camera-video {
  position:fixed;
  top:-9999px; left:-9999px;
  width:320px; height:240px;
  opacity:0; pointer-events:none;
}
#camera-canvas {
  position:fixed;
  top:-9999px; left:-9999px;
  width:320px; height:240px;
}

/* 検知状態インジケーター（デバッグ用・本番は非表示に） */
#detect-status {
  position:fixed; bottom:10px; right:10px;
  font-size:11px; color:rgba(0,180,216,0.4);
  z-index:200; pointer-events:none;
  display:none; /* 本番はnone、確認時はblockに */
}

/* 下部固定枠 */
#bar-qr {
  flex-shrink:0;
  background:#050a0f;
  z-index:50;
  transition:opacity 0.1s;
  position:relative;
}
#bar-qr-line {
  width:100%; height:3px;
  background-color:#00b4d8;
  display:block;
}
#ticker-wrap {
  overflow:hidden; height:64px;
  border-bottom:1px solid #00334d;
  background:#020d14;
  position:relative;
}
#ticker-canvas {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
#qr-row {
  padding:10px 32px;
  display:flex; justify-content:space-between; align-items:center;
  height:96px;
}
.qr-item { display:flex; align-items:center; gap:14px; }
.qr-item img {
  width:72px; height:72px;
  border-radius:6px; background:#fff;
  padding:3px; object-fit:contain;
}
.qr-lbl {
  font-size:20px; font-weight:700;
  color:#00b4d8; letter-spacing:0.1em;
}

/* ロゴ */
#mainOverlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#fff url('トリックロゴ.jpg') no-repeat center center;
  background-size:contain;
  opacity:0; pointer-events:none;
  z-index:100;
}
#focuslight {
  position:fixed; inset:0;
  background:#fff;
  z-index:101; pointer-events:none; opacity:0;
}
#focuslight-center {
  position:fixed; inset:0;
  background:radial-gradient(circle, #fff 0%, #fff 38%, transparent 72%);
  z-index:102; pointer-events:none; opacity:0;
}
@keyframes flicker {
  0%,100% { opacity:1; }
  20%     { opacity:0.1; }
  40%     { opacity:0.9; }
  60%     { opacity:0.05; }
  80%     { opacity:0.8; }
}

/* スタート画面 */
#startOverlay {
  position:fixed; inset:0; background:#000; color:#fff;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:4vw; margin-bottom:2vh; color:#00b4d8; }
#startOverlay p  { font-size:2.5vw; opacity:0.7; }
</style>
</head>
<body>

<div id="startOverlay" style="display:none">
  <h1>タップしてスタート</h1>
  <p>SCREEN 4 (ENTRANCE)</p>
</div>

<div id="mainOverlay"></div>
<div id="focuslight"></div>
<div id="focuslight-center"></div>

<!-- カメラ（非表示・検知専用） -->
<video id="camera-video" autoplay muted playsinline></video>
<canvas id="camera-canvas"></canvas>
<div id="detect-status">検知待機中...</div>

<div id="layout">
  <div id="bar-top">
    <div id="bar-info">
      <div id="date-area">
        <span id="date-str">--/--</span>
        <span id="day-str">(-)</span>
      </div>
      <span id="clock">--:--</span>
    </div>
  </div>

  <div id="content">
    <!-- 顔検知割り込みレイヤー -->
    <div id="welcome-layer">
      <video id="welcome-video" playsinline src="welcome.mp4"></video>
    </div>
    <!-- 通常コンテンツはJSで生成 -->
  </div>

  <div id="bar-qr">
    <div id="bar-qr-line"></div>
    <div id="ticker-wrap">
      <canvas id="ticker-canvas"></canvas>
    </div>
    <div id="qr-row">
      <div class="qr-item">
        <img src="instagram.jpg" alt="Instagram QR">
        <span class="qr-lbl">Instagram</span>
      </div>
      <div class="qr-item">
        <img src="HP.png" alt="HP QR">
        <span class="qr-lbl">ホームページ</span>
      </div>
    </div>
  </div>
</div>

<!-- face-api.js（顔検知ライブラリ） -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
var CYCLE_MS = 59900;

/* ============================================================
   パート定義（差し替えはここのsrcだけ）
============================================================ */
var PARTS = [
  { id:'calendar', type:'image', src:'calendar.jpg',  offset:0,     duration:10000 },
  { id:'free1',    type:'video', src:'video_a.mp4',   offset:10000, duration:10000 },
  { id:'holiday',  type:'image', src:'holiday.jpg',   offset:20000, duration:10000 },
  { id:'free2',    type:'video', src:'video_b.mp4',   offset:30000, duration:10000 },
  { id:'event',    type:'video', src:'video_c.mp4',   offset:40000, duration:10000 },
  { id:'logo',     type:'logo',                       offset:50000, duration:9900  }
];

/* ============================================================
   顔検知設定
============================================================ */
var FACE_SETTINGS = {
  welcomeSrc   : 'welcome.mp4', /* いらっしゃいませ動画 */
  welcomeDur   : 15000,         /* 表示時間（ms） */
  cooldown     : 30000,         /* 再検知禁止時間（ms） */
  checkInterval: 500,           /* 検知チェック間隔（ms） */
  minConfidence: 0.6,           /* 検知の確度しきい値（0〜1） */
  modelPath    : 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights' /* モデルの場所 */
};

/* ============================================================
   DOM生成
============================================================ */
var contentEl  = document.getElementById('content');
var imageEls   = {};
var videoEls   = {};

PARTS.forEach(function(p) {
  if (p.type === 'image') {
    var el = document.createElement('div');
    el.className = 'slide';
    el.style.backgroundImage = "url('" + p.src + "')";
    contentEl.appendChild(el);
    imageEls[p.id] = el;
  } else if (p.type === 'video') {
    var wrap = document.createElement('div');
    wrap.className = 'video-slide';
    var vid = document.createElement('video');
    vid.src = p.src; vid.muted = false;
    vid.setAttribute('muted',''); vid.setAttribute('playsinline','');
    vid.preload = 'auto'; vid.loop = false;
    wrap.appendChild(vid);
    contentEl.appendChild(wrap);
    videoEls[p.id] = { wrap:wrap, vid:vid };
  }
});

/* ============================================================
   要素取得
============================================================ */
var overlay          = document.getElementById('mainOverlay');
var focuslight       = document.getElementById('focuslight');
var focuslightCenter = document.getElementById('focuslight-center');
var barTop           = document.getElementById('bar-top');
var barQr            = document.getElementById('bar-qr');
var welcomeLayer     = document.getElementById('welcome-layer');
var welcomeVideo     = document.getElementById('welcome-video');
var cameraVideo      = document.getElementById('camera-video');
var cameraCanvas     = document.getElementById('camera-canvas');
var detectStatus     = document.getElementById('detect-status');

var started    = false;
var lastPartId = null;
var wasLogo    = false;

/* ============================================================
   顔検知状態
============================================================ */
var faceDetectEnabled = false;
var welcomeActive     = false;
var lastDetectedTime  = 0;
var welcomeTimer      = null;

/* ============================================================
   顔検知の初期化
============================================================ */
async function initFaceDetection() {
  try {
    /* 軽量モデル（tiny_face_detector）を読み込む */
    await faceapi.nets.tinyFaceDetector.loadFromUri(FACE_SETTINGS.modelPath);

    /* カメラ起動 */
    var stream = await navigator.mediaDevices.getUserMedia({
      video: { width:320, height:240, facingMode:'user' },
      audio: false
    });
    cameraVideo.srcObject = stream;
    await cameraVideo.play();

    faceDetectEnabled = true;
    detectStatus.textContent = '顔検知 稼働中';

    /* 定期的に顔を検知 */
    setInterval(detectFace, FACE_SETTINGS.checkInterval);

  } catch(e) {
    detectStatus.textContent = 'カメラ未使用: ' + e.message;
    console.warn('Face detection init failed:', e);
  }
}

/* ============================================================
   顔検知メイン処理
============================================================ */
async function detectFace() {
  if (!faceDetectEnabled) return;
  if (welcomeActive) return;

  var now = Date.now();
  if (now - lastDetectedTime < FACE_SETTINGS.cooldown) return;

  /* ロゴ表示中は検知しない */
  if (wasLogo) return;

  try {
    var result = await faceapi.detectSingleFace(
      cameraVideo,
      new faceapi.TinyFaceDetectorOptions({ scoreThreshold: FACE_SETTINGS.minConfidence })
    );

    if (result) {
      lastDetectedTime = now;
      triggerWelcome();
    }
  } catch(e) {}
}

/* ============================================================
   いらっしゃいませ動画の割り込み再生
============================================================ */
function triggerWelcome() {
  if (welcomeActive) return;
  welcomeActive = true;

  detectStatus.textContent = '顔を検知！ 動画再生中...';

  welcomeVideo.src = FACE_SETTINGS.welcomeSrc;
  welcomeVideo.currentTime = 0;
  welcomeLayer.classList.add('active');
  welcomeVideo.play().catch(function(){});

  /* 動画終了または時間経過で元に戻る */
  welcomeVideo.onended = function() { endWelcome(); };
  welcomeTimer = setTimeout(endWelcome, FACE_SETTINGS.welcomeDur);
}

function endWelcome() {
  if (!welcomeActive) return;
  welcomeActive = false;
  clearTimeout(welcomeTimer);
  welcomeVideo.pause();
  welcomeVideo.onended = null;
  welcomeLayer.classList.remove('active');
  detectStatus.textContent = '顔検知 稼働中（クールダウン中）';
  setTimeout(function() {
    detectStatus.textContent = '顔検知 稼働中';
  }, FACE_SETTINGS.cooldown);
}

/* ============================================================
   通常コンテンツ表示
============================================================ */
function hideAll() {
  Object.keys(imageEls).forEach(function(id) {
    imageEls[id].style.opacity = '0';
  });
  Object.keys(videoEls).forEach(function(id) {
    videoEls[id].wrap.style.opacity = '0';
    videoEls[id].vid.pause();
    videoEls[id].vid.currentTime = 0;
  });
}

function showImage(id) {
  hideAll();
  if (imageEls[id]) imageEls[id].style.opacity = '1';
}

function showVideo(id, partOff) {
  hideAll();
  var v = videoEls[id];
  if (!v) return;
  v.vid.currentTime = Math.min(partOff / 1000, v.vid.duration || 0);
  v.wrap.style.opacity = '1';
  v.vid.play().catch(function(){});
}

/* ============================================================
   ロゴエフェクト
============================================================ */
function playLogoEnter() {
  barTop.style.animation = 'flicker 0.4s ease forwards';
  barQr.style.animation  = 'flicker 0.4s ease forwards';
  setTimeout(function() {
    barTop.style.display = 'none'; barQr.style.display = 'none';
    barTop.style.animation = ''; barQr.style.animation = '';
    focuslight.style.transition = 'none';
    focuslightCenter.style.transition = 'none';
    focuslight.style.opacity = '1';
    focuslightCenter.style.opacity = '1';
    overlay.style.transition = 'none';
    overlay.style.opacity = '1';
    setTimeout(function() {
      focuslight.style.transition = 'opacity 0.8s ease-in';
      focuslight.style.opacity = '0';
      setTimeout(function() {
        focuslightCenter.style.transition = 'opacity 0.8s ease-in';
        focuslightCenter.style.opacity = '0';
      }, 250);
    }, 350);
  }, 400);
}

function playLogoExit() {
  overlay.style.transition = '';
  overlay.style.opacity = '0';
  barTop.style.display = '';
  barQr.style.display = '';
}

/* ============================================================
   メインループ
============================================================ */
function getPartByOffset(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

function tick() {
  if (!started) return;
  var offset  = Date.now() % CYCLE_MS;
  var part    = getPartByOffset(offset);
  if (part.id === lastPartId) return;
  lastPartId  = part.id;
  var partOff = offset - part.offset;

  if (part.type === 'logo') {
    hideAll();
    playLogoEnter();
    wasLogo = true;
    return;
  }
  if (wasLogo) { wasLogo = false; playLogoExit(); }
  else { overlay.style.transition=''; overlay.style.opacity='0'; barTop.style.display=''; barQr.style.display=''; }

  if (part.type === 'image')      showImage(part.id);
  else if (part.type === 'video') showVideo(part.id, partOff);
}

setInterval(tick, 100);

/* ============================================================
   時計・日付
============================================================ */
var DAY_JA = ['日','月','火','水','木','金','土'];

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
function updateDate() {
  try {
    var now = new Date();
    document.getElementById('date-str').textContent = (now.getMonth()+1) + '/' + now.getDate();
    var dayEl = document.getElementById('day-str');
    dayEl.textContent = '(' + DAY_JA[now.getDay()] + ')';
    dayEl.style.color = now.getDay()===0 ? '#ef476f' : now.getDay()===6 ? '#4cc9f0' : '#ffffff';
  } catch(e) {}
}
updateClock(); updateDate();
setInterval(updateClock, 30000);
setInterval(updateDate,  60000);

/* ============================================================
   テロップ
============================================================ */
var TICKER_TEXT  = 'サイクルセンター山口　自転車の販売・修理・クリーニング　お気軽にご相談ください　　　　　　　　　';
var TICKER_SPEED = 80;
var tc = document.getElementById('ticker-canvas');
var tx = tc.getContext('2d');
var tW = 0, tH = 0, textW = 0;

function initTicker() {
  tW = tc.offsetWidth; tH = tc.offsetHeight;
  tc.width = tW; tc.height = tH;
  tx.font = '700 48px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  textW = tx.measureText(TICKER_TEXT).width;
}
function drawTicker() {
  if (!started) { requestAnimationFrame(drawTicker); return; }
  tx.clearRect(0, 0, tW, tH);
  var loopW = textW + tW;
  var pos   = ((Date.now()/1000) * TICKER_SPEED) % loopW;
  var x     = tW - pos;
  tx.font = '700 48px "Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
  tx.fillStyle = '#00b4d8'; tx.textBaseline = 'middle';
  tx.fillText(TICKER_TEXT, x, tH/2);
  if (x + textW < tW) tx.fillText(TICKER_TEXT, x + textW, tH/2);
  requestAnimationFrame(drawTicker);
}

function loadConfig() {
  fetch('ticker.txt', { cache:'no-cache' })
    .then(function(r){ if(!r.ok) throw new Error(); return r.text(); })
    .then(function(t){
      var line = t.split(/\r?\n/).map(function(l){return l.trim();})
                  .filter(function(l){return l.length>0;}).join('　');
      if (line) { TICKER_TEXT = line + '　　　　　　　　　'; if(tW) textW = tx.measureText(TICKER_TEXT).width; }
    }).catch(function(){});
}
loadConfig();

/* ============================================================
   スタート
============================================================ */
/* 自動スタート：ページ読み込み後すぐに開始 */
function autoStart() {
  document.getElementById('startOverlay').style.display = 'none';
  var el = document.documentElement;
  if (el.requestFullscreen)            el.requestFullscreen().catch(function(){});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  started = true;
  initTicker();
  requestAnimationFrame(drawTicker);
  initFaceDetection();
  unlockAudio();
}

/* DOMContentLoaded後に自動スタート */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', autoStart);
} else {
  autoStart();
}

/* フォールバック：クリックでもスタートできる */
document.getElementById('startOverlay').addEventListener('click', autoStart);
window.addEventListener('resize', initTicker);

/* ============================================================
   音声ロック解除（スタートボタン押下後に呼び出す）
   ブラウザは「ユーザー操作後」の音声再生を許可する
============================================================ */
function unlockAudio() {
  /* 無音のAudioContextを一瞬再生して音声を許可状態にする */
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.resume();
  } catch(e) {}

  /* 既存の動画要素のmutedを全て解除 */
  document.querySelectorAll('video').forEach(function(v) {
    if (v.id !== 'camera-video') { /* カメラはmuted維持 */
      v.muted = false;
      v.volume = 1.0;
    }
  });
}
</script>
</body>
</html>
