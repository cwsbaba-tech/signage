<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background:#000; overflow:hidden;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#stage { position:fixed; top:0; left:0; right:0; bottom:0; }

/* 待機中スライド */
.slide {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.6s ease-in-out; transition:opacity 0.6s ease-in-out;
}

/* 左右タップ領域（左半分＝PayPay、右半分＝ナカペイ） */
#tap-left, #tap-right {
  position:absolute; top:0; bottom:0; width:50%; z-index:10;
  cursor:pointer;
}
#tap-left  { left:0; }
#tap-right { right:0; }

/* 期間限定バナー（上部） */
#banner {
  position:absolute; top:0; left:0; right:0; z-index:20;
  padding:1.6vmin 3vmin; text-align:center;
  font-size:28px; font-weight:700; color:#fff;
  background:rgba(180,20,40,0.88); border-bottom:3px solid #ffd700;
  text-shadow:0 2px 6px rgba(0,0,0,0.5);
  display:none;
}

/* 下部ボタンバー（通常は非表示・ルーレット期間中のみ表示） */
#bar {
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  display:none; justify-content:center; align-items:center;
  padding:2vmin 3vmin;
  background:rgba(5,10,15,0.88); border-top:3px solid #00b4d8;
}
.btn {
  min-width:22vmin; padding:1.8vmin 3vmin;
  font-family:inherit; font-size:24px; font-weight:700;
  color:#fff; border:2px solid #fff; border-radius:2vmin; background:#222;
  cursor:pointer;
}
.btn:active { opacity:0.7; }
#btn-roulette { background:#b8860b; border-color:#ffd700; display:none; }

/* 共通オーバーレイ */
.overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.92);
  display:none; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; color:#fff;
}
.overlay.show { display:flex; }
.close-btn {
  position:absolute; top:2vmin; right:2vmin; z-index:120;
  padding:1.4vmin 3vmin; font-size:22px; font-weight:700;
  font-family:inherit; color:#fff; background:#444; border:2px solid #888; border-radius:1.6vmin;
  cursor:pointer;
}
.ov-title { font-size:36px; font-weight:700; margin:0 0 2vmin; }
.ov-sub   { font-size:22px; color:#caf0f8; margin:2vmin 0 0; }

/* QR */
#qr-card { background:#fff; padding:2.4vmin; border-radius:2vmin; }
#qr-img { display:block; width:360px; height:360px; object-fit:contain; }

/* ルーレット */
#wheel-wrap { position:relative; }
#wheel { display:block; }
#spin-btn { margin-top:2vmin; background:#b8860b; border-color:#ffd700; display:inline-block; }
#roulette-result {
  min-height:6vmin; margin-top:1.6vmin;
  font-size:32px; font-weight:700; color:#ffd700;
}

/* スタート */
#startOverlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:#000; color:#fff;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center;
}
#startOverlay h1 { font-size:36px; margin:0 0 2vmin; color:#00b4d8; }
#startOverlay p  { font-size:20px; opacity:0.7; margin:0; }
</style>
</head>
<body>

<div id="startOverlay" onclick="startApp()">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<div id="stage">
  <div id="p1" class="slide" style="background-image:url('calendar.jpg');"></div>
  <div id="p2" class="slide" style="background-image:url('free1_01.png');"></div>
  <div id="p3" class="slide" style="background-image:url('holiday.jpg');"></div>
  <div id="p4" class="slide" style="background-image:url('free2_01.jpg');"></div>
  <div id="p5" class="slide" style="background-image:url('event.jpg');"></div>
  <div id="p6" class="slide" style="background-image:url('横長ロゴ.jpg');"></div>

  <div id="tap-left" onclick="showQr('paypay')"></div>
  <div id="tap-right" onclick="showQr('nakapay')"></div>

  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btn-roulette" onclick="openRoulette()">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qr-overlay">
  <button class="close-btn" onclick="closeAll()">戻る</button>
  <div style="position:absolute;top:0;bottom:0;left:0;width:50%;z-index:110;" onclick="showQr('paypay')"></div>
  <div style="position:absolute;top:0;bottom:0;right:0;width:50%;z-index:110;" onclick="showQr('nakapay')"></div>
  <p class="ov-title" id="qr-title">PayPay</p>
  <div id="qr-card"><img id="qr-img" src="qr_paypay.png" alt="QR"></div>
  <p class="ov-sub">スマートフォンでスキャンしてお支払いください</p>
  <p class="ov-sub">金額はレジの画面でご確認ください</p>
</div>

<div class="overlay" id="roulette-overlay">
  <button class="close-btn" onclick="closeRoulette()">閉じる</button>
  <p class="ov-title" id="roulette-title">ルーレット</p>
  <div id="wheel-wrap"><canvas id="wheel"></canvas></div>
  <button class="btn" id="spin-btn" onclick="spinWheel()">スタート</button>
  <div id="roulette-result"></div>
</div>

<script>
var CONFIG = {
  cycleMs         : 59900,
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qrPaypay        : 'qr_paypay.png',
  qrNakapay       : 'qr_nakapay.png'
};

var started = false;
var lastPartId = '';

function tick() {
  if (!started) return;
  var offset = Date.now() % CONFIG.cycleMs;
  var partId = 'p1';
  if (offset >= 50000) partId = 'p6';
  else if (offset >= 40000) partId = 'p5';
  else if (offset >= 30000) partId = 'p4';
  else if (offset >= 20000) partId = 'p3';
  else if (offset >= 10000) partId = 'p2';

  if (partId === lastPartId) return;
  lastPartId = partId;

  document.getElementById('p1').style.opacity = (partId === 'p1') ? '1' : '0';
  document.getElementById('p2').style.opacity = (partId === 'p2') ? '1' : '0';
  document.getElementById('p3').style.opacity = (partId === 'p3') ? '1' : '0';
  document.getElementById('p4').style.opacity = (partId === 'p4') ? '1' : '0';
  document.getElementById('p5').style.opacity = (partId === 'p5') ? '1' : '0';
  document.getElementById('p6').style.opacity = (partId === 'p6') ? '1' : '0';
}
setInterval(tick, 100);

var qrOverlay = document.getElementById('qr-overlay');
var rlOverlay = document.getElementById('roulette-overlay');
var returnTimer = null;

function closeAll() {
  qrOverlay.classList.remove('show');
  rlOverlay.classList.remove('show');
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}
function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

/* QR事前読み込み */
var preloadPaypay = new Image();
preloadPaypay.src = CONFIG.qrPaypay;
var preloadNakapay = new Image();
preloadNakapay.src = CONFIG.qrNakapay;

function showQr(kind) {
  if (!started) return;
  closeAll();
  if (kind === 'paypay') {
    document.getElementById('qr-title').textContent = 'PayPay';
    document.getElementById('qr-img').src = CONFIG.qrPaypay;
  } else {
    document.getElementById('qr-title').textContent = 'ナカペイ';
    document.getElementById('qr-img').src = CONFIG.qrNakapay;
  }
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

/* 期間限定イベント */
var activeBanners = new Array();
var bannerIdx = 0;
var activeRoulette = null;
var bannerEl = document.getElementById('banner');
var barEl = document.getElementById('bar');
var btnRoulette = document.getElementById('btn-roulette');

function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function applyEvents(text) {
  var lines = text.split('\n');
  var today = todayStr();
  activeBanners = new Array();
  activeRoulette = null;

  for (var i = 0; i < lines.length; i++) {
    var l = lines.slice(i, i + 1).join('').trim();
    if (!l || l.charAt(0) === '#' || l.indexOf('|') === -1) continue;
    var cols = l.split('|');
    if (cols.length < 4) continue;
    var start = cols.slice(0, 1).join('').trim();
    var end   = cols.slice(1, 2).join('').trim();
    var type  = cols.slice(2, 3).join('').trim();
    var val   = cols.slice(3, 4).join('').trim();
    if (today >= start && today <= end) {
      if (type === 'banner') activeBanners.push(val);
      if (type === 'roulette') activeRoulette = val;
    }
  }

  if (activeBanners.length > 0) {
    bannerEl.textContent = activeBanners.slice(0, 1).join('');
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  if (activeRoulette) {
    btnRoulette.style.display = 'inline-block';
    barEl.style.display = 'flex';
    loadPrizes(activeRoulette);
  } else {
    btnRoulette.style.display = 'none';
    barEl.style.display = 'none';
  }
}

setInterval(function() {
  if (activeBanners.length > 1) {
    bannerIdx = (bannerIdx + 1) % activeBanners.length;
    bannerEl.textContent = activeBanners.slice(bannerIdx, bannerIdx + 1).join('');
  }
}, 5000);

function loadEvents() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'events.txt?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
        if (xhr.responseText) applyEvents(xhr.responseText);
      }
    };
    xhr.send();
  } catch (e) {}
}

/* ルーレット */
var PRIZES = new Array('1等', '2等', '3等', '参加賞');
var COLORS = new Array('#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261', '#8338ec');
var wheelCanvas = document.getElementById('wheel');
var ctx = wheelCanvas.getContext('2d');
var currentAngle = 0;
var isSpinning = false;

function loadPrizes(filename) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', filename + '?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
        if (xhr.responseText) {
