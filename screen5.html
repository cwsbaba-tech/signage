<script>
var CONFIG = {
  cycleMs         : 60000, // 10秒 × 6枚 = 60000ms に修正
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qrPaypay        : 'qr_paypay.png',
  qrNakapay       : 'qr_nakapay.png'
};

var stage = document.getElementById('stage');
var tapLeft = document.getElementById('tapLeft');

function createSlide(id, src) {
  var el = document.createElement('div');
  el.id = id;
  el.className = 'slide';
  el.style.backgroundImage = "url('" + src + "')";
  // タップ領域より背面に順番通り追加
  stage.insertBefore(el, tapLeft);
  return el;
}

var slides = [
  createSlide('p1', 'calendar.jpg'),
  createSlide('p2', 'free1_01.png'),
  createSlide('p3', 'holiday.jpg'),
  createSlide('p4', 'free2_01.jpg'),
  createSlide('p5', 'event.jpg'),
  createSlide('p6', 'logo_wide.jpg') // 半角英数字推奨
];

var lastIndex = -1;

function tick() {
  var offset = Date.now() % CONFIG.cycleMs;
  var idx = Math.floor(offset / 10000);
  if (idx >= slides.length) idx = 0;

  if (idx === lastIndex) return;
  lastIndex = idx;

  for (var i = 0; i < slides.length; i++) {
    slides[i].style.opacity = (i === idx) ? '1' : '0';
  }
}

/* QR事前読み込み */
var preload1 = new Image(); preload1.src = CONFIG.qrPaypay;
var preload2 = new Image(); preload2.src = CONFIG.qrNakapay;

var qrOverlay = document.getElementById('qrOverlay');
var rlOverlay = document.getElementById('rouletteOverlay');
var returnTimer = null;

function closeAll() {
  if (spinning) return; // 回転中は閉じない
  qrOverlay.classList.remove('show');
  rlOverlay.classList.remove('show');
  if (returnTimer) {
    clearTimeout(returnTimer);
    returnTimer = null;
  }
}

function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

function showPaypay() {
  closeAll();
  document.getElementById('qrTitle').textContent = 'PayPay';
  document.getElementById('qrImg').src = CONFIG.qrPaypay;
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

function showNakapay() {
  closeAll();
  document.getElementById('qrTitle').textContent = 'ナカペイ';
  document.getElementById('qrImg').src = CONFIG.qrNakapay;
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

document.getElementById('tapLeft').addEventListener('click', showPaypay);
document.getElementById('tapRight').addEventListener('click', showNakapay);
document.getElementById('qrLeft').addEventListener('click', showPaypay);
document.getElementById('qrRight').addEventListener('click', showNakapay);
document.getElementById('qrClose').addEventListener('click', closeAll);

/* イベント読み込み（events.txt） */
var prizeFile = '';

function pad2(n) {
  return (n < 10) ? ('0' + n) : ('' + n);
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function parseEvents(rawText) {
  var today = getToday();
  var lines = rawText.split(/\r?\n/);
  var firstBanner = '';
  prizeFile = '';

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line || line.charAt(0) === '#') continue;

    var parts = line.split('|');
    if (parts.length < 4) continue;

    var start = parts[0].trim();
    var end   = parts[1].trim();
    var type  = parts[2].trim();
    var val   = parts.slice(3).join('|').trim();

    if (today >= start && today <= end) {
      if (type === 'banner' && firstBanner === '') {
        firstBanner = val;
      }
      if (type === 'roulette') {
        prizeFile = val;
      }
    }
  }

  var bannerEl = document.getElementById('banner');
  if (firstBanner !== '') {
    bannerEl.textContent = firstBanner;
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  var barEl = document.getElementById('bar');
  var btnEl = document.getElementById('btnRoulette');
  if (prizeFile !== '') {
    btnEl.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(prizeFile);
  } else {
    btnEl.style.display = 'none';
    barEl.style.display = 'none';
  }
}

function loadEvents() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'events.txt?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
      if (xhr.responseText) parseEvents(xhr.responseText);
    }
  };
  xhr.send();
}

/* ルーレット処理（補完実装） */
var prizes = ['1等', '2等', '3等', '参加賞'];
var currentAngle = 0;
var spinning = false;
var colors = ['#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261', '#8338ec'];

function loadPrizes(file) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', file + '?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
      if (xhr.responseText) {
        var lines = xhr.responseText.split(/\r?\n/);
        var list = [];
        for (var i = 0; i < lines.length; i++) {
          var s = lines[i].trim();
          if (s && s.charAt(0) !== '#') list.push(s);
        }
        if (list.length > 0) {
          prizes = list;
          drawWheel();
        }
      }
    }
  };
  xhr.send();
}

function drawWheel() {
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var cx = canvas.width / 2;
  var cy = canvas.height / 2;
  var radius = cx - 10;
  var arc = (Math.PI * 2) / prizes.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var i = 0; i < prizes.length; i++) {
    var angle = currentAngle + i * arc;
    ctx.beginPath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, angle, angle + arc);
    ctx.lineTo(cx, cy);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // テキスト描画
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle + arc / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(prizes[i], radius - 16, 7);
    ctx.restore();
  }

  // 上部の針（インジケーター）
  ctx.beginPath();
  ctx.fillStyle = '#ffd700';
  ctx.moveTo(cx - 12, 2);
  ctx.lineTo(cx + 12, 2);
  ctx.lineTo(cx, 24);
  ctx.closePath();
  ctx.fill();
}

function spinRoulette() {
  if (spinning) return;
  spinning = true;
  document.getElementById('rouletteResult').textContent = '';
  if (returnTimer) clearTimeout(returnTimer);

  var spinDuration = 4000;
  var startAngle = currentAngle;
  var totalRotate = (Math.PI * 2) * (5 + Math.random() * 5);
  var startTime = Date.now();

  function animate() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(elapsed / spinDuration, 1);
    // イージング（徐々に減速）
    var easeOut = 1 - Math.pow(1 - progress, 3);
    currentAngle = startAngle + totalRotate * easeOut;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      // 上部（-Math.PI/2 = 1.5*Math.PI）にある当選項目を計算
      var arc = (Math.PI * 2) / prizes.length;
      var pointerAngle = (Math.PI * 1.5 - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      var winIdx = Math.floor(pointerAngle / arc) % prizes.length;
      document.getElementById('rouletteResult').textContent = '結果：' + prizes[winIdx];
      setReturnTimer(CONFIG.resultTimeoutMs);
    }
  }
  requestAnimationFrame(animate);
}

document.getElementById('btnRoulette').addEventListener('click', function() {
  closeAll();
  document.getElementById('rouletteResult').textContent = '';
  drawWheel();
  rlOverlay.classList.add('show');
  setReturnTimer(CONFIG.rouletteIdleMs);
});

document.getElementById('spinBtn').addEventListener('click', spinRoulette);
document.getElementById('rouletteClose').addEventListener('click', closeAll);

/* 初期化・定期実行 */
tick();
setInterval(tick, 500);
loadEvents();
setInterval(loadEvents, 60000); // 1分ごとにイベント再確認
drawWheel();
</script>
</body>
</html>
