<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background:#111; overflow:hidden; cursor:none;
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#stage { position:fixed; top:0; left:0; right:0; bottom:0; background:#111; }

/* 待機中スライド */
.slide {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.6s ease-in-out; transition:opacity 0.6s ease-in-out;
}

/* 期間限定バナー（上部） */
#banner {
  position:absolute; top:0; left:0; right:0; z-index:20;
  padding:1.6vmin 3vmin; text-align:center;
  font-size:clamp(20px,4vmin,44px); font-weight:700; color:#fff;
  background:rgba(180,20,40,0.88); border-bottom:3px solid #ffd700;
  text-shadow:0 2px 6px rgba(0,0,0,0.5);
  display:none;
}

/* 下部ボタンバー（通常は非表示・ルーレット期間中のみ表示） */
#bar {
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  display:none; justify-content:center; align-items:center; gap:3vmin;
  padding:2vmin 3vmin;
  background:rgba(5,10,15,0.88); border-top:3px solid #00b4d8;
}
.btn {
  min-width:22vmin; padding:1.8vmin 3vmin;
  font-family:inherit; font-size:clamp(18px,3.4vmin,36px); font-weight:700;
  color:#fff; border:2px solid #fff; border-radius:2vmin; background:#222;
  cursor:pointer;
  touch-action:manipulation;
}
.btn:active { opacity:0.7; }
#btn-roulette { background:#b8860b; border-color:#ffd700; display:none; }

/* 共通オーバーレイ（スマホ・タブレット両対応） */
.overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.92);
  display:none; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; color:#fff;
  padding:clamp(56px, 9vmin, 90px) clamp(16px, 4vw, 40px) clamp(20px, 4vmin, 40px);
  box-sizing:border-box;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.overlay.show { display:flex; }
.close-btn {
  position:fixed; top:clamp(12px, 2.5vmin, 28px); right:clamp(12px, 2.5vw, 28px); z-index:110;
  padding:clamp(8px, 1.4vmin, 16px) clamp(16px, 3vw, 32px);
  font-size:clamp(15px, 2.6vmin, 28px); font-weight:700;
  font-family:inherit; color:#fff; background:#444; border:2px solid #888; border-radius:1.6vmin;
  cursor:pointer;
}
.ov-title {
  font-size:clamp(22px, 4.4vmin, 48px);
  font-weight:700;
  margin:0 0 clamp(10px, 2vmin, 20px);
  flex-shrink:0;
}
.ov-sub {
  font-size:clamp(14px, 2.5vmin, 28px);
  line-height:1.45;
  color:#caf0f8;
  margin:clamp(8px, 1.4vmin, 14px) 0 0;
  max-width:min(90vw, 720px);
  flex-shrink:0;
}

/* QR（縦長スマホ・横長タブレット両方で画面内に収める） */
#qr-card {
  background:#fff;
  padding:clamp(10px, 2vmin, 22px);
  border-radius:clamp(12px, 2vmin, 24px);
  box-sizing:border-box;
  flex-shrink:0;
  max-width:100%;
  max-height:100%;
}
#qr-img {
  display:block;
  width:min(68vw, 50vh, 520px);
  height:min(68vw, 50vh, 520px);
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* ルーレット */
#wheel-wrap { position:relative; flex-shrink:0; }
#wheel { display:block; }
#spin-btn { margin-top:2vmin; background:#b8860b; border-color:#ffd700; display:inline-block; flex-shrink:0; }
#roulette-result {
  min-height:6vmin; margin-top:1.6vmin;
  font-size:clamp(22px,4.4vmin,50px); font-weight:700; color:#ffd700;
  flex-shrink:0;
}

/* スタート */
#startOverlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:#000; color:#fff;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  z-index:9999; cursor:pointer; text-align:center; padding:20px; box-sizing:border-box;
}
#startOverlay.hidden { display:none !important; }
#startOverlay h1 { font-size:clamp(24px, 5vmin, 52px); margin:0 0 2vmin; color:#00b4d8; }
#startOverlay p  { font-size:clamp(16px, 3vmin, 32px); opacity:0.7; margin:0; }
* { cursor:none !important; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<div id="stage">
  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btn-roulette">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qr-overlay">
  <button class="close-btn" id="qr-close">戻る</button>
  <p class="ov-title" id="qr-title">PayPay</p>
  <div id="qr-card"><img id="qr-img" alt="QR"></div>
  <p class="ov-sub">スマートフォンでスキャンしてお支払いください</p>
  <p class="ov-sub">金額はレジの画面でご確認ください</p>
</div>

<div class="overlay" id="roulette-overlay">
  <button class="close-btn" id="roulette-close">閉じる</button>
  <p class="ov-title" id="roulette-title">ルーレット</p>
  <div id="wheel-wrap"><canvas id="wheel"></canvas></div>
  <button class="btn" id="spin-btn">スタート</button>
  <div id="roulette-result"></div>
</div>

<script>
/* ============================================================
   設定（ここだけ変更する）
============================================================ */
var CONFIG = {
  cycleMs         : 59900,            /* 他のスクリーンと同じ */
  qrTimeoutMs     : 60000,            /* QR表示後、待機に戻るまで */
  rouletteIdleMs  : 90000,            /* ルーレットを開いたまま放置した場合 */
  resultTimeoutMs : 15000,            /* 結果表示後、待機に戻るまで */
  qr : { paypay:'qr_paypay.png', nakapay:'qr_nakapay.png' }
};

/* 待機中に流す画像（10秒ずつ・6パートで59.9秒）。差し替えはここだけ */
var PARTS = [
  { id:'p1', src:'calendar.jpg', offset:0     },
  { id:'p2', src:'free1_01.png', offset:10000 },
  { id:'p3', src:'holiday.jpg',  offset:20000 },
  { id:'p4', src:'free2_01.jpg', offset:30000 },
  { id:'p5', src:'event.jpg',    offset:40000 },
  { id:'p6', src:'横長ロゴ.jpg', offset:50000 }
];

/* ============================================================
   画面の切り替え管理（先に定義して参照エラーを防ぐ）
============================================================ */
var qrOverlay = document.getElementById('qr-overlay');
var rlOverlay = document.getElementById('roulette-overlay');
var returnTimer = null;

function closeAll() {
  qrOverlay.classList.remove('show');
  rlOverlay.classList.remove('show');
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}
function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

/* ============================================================
   QR表示（事前読み込み ＋ 左右タップ切り替え）
============================================================ */
function encodeImgSrc(src) {
  return encodeURI(src);
}

new Image().src = encodeImgSrc(CONFIG.qr.paypay);
new Image().src = encodeImgSrc(CONFIG.qr.nakapay);

function showQr(kind, label) {
  closeAll();
  document.getElementById('qr-title').textContent = label;
  document.getElementById('qr-img').src = encodeImgSrc(CONFIG.qr[kind]);
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

/* ============================================================
   待機サイネージ（スクリーン1〜4と同じ Date.now() 基準で同期）
============================================================ */
var stage = document.getElementById('stage');
var slideEls = {};
PARTS.forEach(function(p) {
  var el = document.createElement('div');
  el.className = 'slide';
  el.style.backgroundImage = "url('" + encodeImgSrc(p.src) + "')";
  stage.insertBefore(el, stage.firstChild);
  slideEls[p.id] = el;
});

var started = false, lastPartId = null;

function getPart(offset) {
  for (var i = PARTS.length - 1; i >= 0; i--) {
    if (offset >= PARTS[i].offset) return PARTS[i];
  }
  return PARTS[0];
}

function tick() {
  if (!started) return;
  var part = getPart(Date.now() % CONFIG.cycleMs);
  if (part.id === lastPartId) return;
  lastPartId = part.id;
  Object.keys(slideEls).forEach(function(id) {
    slideEls[id].style.opacity = (id === part.id) ? '1' : '0';
  });
}
setInterval(tick, 100);

/* ============================================================
   スタート画面（タップで確実に開始）
============================================================ */
var startOverlay = document.getElementById('startOverlay');
var startHandled = false;

function handleStartTap(e) {
  if (startHandled) return;
  startHandled = true;
  started = true;
  startOverlay.classList.add('hidden');
  tick();
  loadEvents();
}

startOverlay.addEventListener('click', handleStartTap);
startOverlay.addEventListener('touchend', function(e) {
  e.preventDefault();
  handleStartTap(e);
}, { passive: false });

/* ============================================================
   左右タップで PayPay / ナカペイ に切り替え
============================================================ */
var lastSideTapTime = 0;

function handleSideTap(e) {
  if (!started) return;
  if (e.target && e.target.closest && e.target.closest('button')) return;

  var now = Date.now();
  if (now - lastSideTapTime < 250) return;
  lastSideTapTime = now;

  var x = 0;
  if (typeof e.clientX === 'number' && e.clientX > 0) {
    x = e.clientX;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    x = e.changedTouches[0].clientX;
  } else if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX;
  }

  if (x < window.innerWidth / 2) {
    showQr('paypay', 'PayPay');
  } else {
    showQr('nakapay', 'ナカペイ');
  }
}

document.getElementById('qr-close').addEventListener('click', function(e) {
  e.stopPropagation();
  closeAll();
});

stage.addEventListener('click', handleSideTap);
stage.addEventListener('touchend', handleSideTap, { passive: true });

qrOverlay.addEventListener('click', handleSideTap);
qrOverlay.addEventListener('touchend', handleSideTap, { passive: true });

/* ============================================================
   期間限定イベント（events.txt）
============================================================ */
var activeBanners = [];
var bannerIdx = 0;
var activeRoulette = null;
var bannerEl = document.getElementById('banner');
var barEl = document.getElementById('bar');
var btnRoulette = document.getElementById('btn-roulette');

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseLines(text) {
  return text.split(/\r?\n/).map(function(l){ return l.trim(); })
             .filter(function(l){ return l.length > 0 && l.charAt(0) !== '#' && l.indexOf('|') !== -1; });
}

function applyEvents(lines) {
  var today = todayStr();
  activeBanners = [];
  activeRoulette = null;

  lines.forEach(function(line) {
    var cols = line.split('|');
    if (cols.length < 4) return;
    var start = cols[0].trim();
    var end   = cols[1].trim();
    var type  = cols[2].trim();
    var val   = cols[3].trim();
    if (today >= start && today <= end) {
      if (type === 'banner') activeBanners.push(val);
      if (type === 'roulette') activeRoulette = val;
    }
  });

  if (activeBanners.length > 0) {
    bannerIdx = 0;
    bannerEl.textContent = activeBanners[0];
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  if (activeRoulette) {
    btnRoulette.style.display = 'inline-block';
    barEl.style.display = 'flex';
    loadPrizes(activeRoulette);
  } else {
    btnRoulette.style.display = 'none';
    barEl.style.display = 'none';
  }
}

setInterval(function() {
  if (activeBanners.length > 1) {
    bannerIdx = (bannerIdx + 1) % activeBanners.length;
    bannerEl.textContent = activeBanners[bannerIdx];
  }
}, 5000);

function loadEvents() {
  fetch('events.txt?t=' + Date.now())
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(txt){ if (txt) applyEvents(parseLines(txt)); })
    .catch(function(){});
}
setInterval(loadEvents, 60000);

/* ============================================================
   ルーレット描画・抽選処理
============================================================ */
var prizes = ['あたり', 'はずれ', 'もう1回', 'プチ賞'];
var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');
var spinBtn = document.getElementById('spin-btn');
var resultEl = document.getElementById('roulette-result');
var wheelAngle = 0;
var spinning = false;
var wheelColors = ['#c1121f', '#1d3557', '#2a9d8f', '#e9c46a', '#6a4c93', '#f77f00'];

function loadPrizes(filename) {
  fetch(filename + '?t=' + Date.now())
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(txt) {
      if (!txt) return;
      var list = txt.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
      if (list.length > 0) {
        prizes = list;
        drawWheel(wheelAngle);
      }
    })
    .catch(function(){});
}

function resizeWheel() {
  var size = Math.min(window.innerWidth * 0.65, window.innerHeight * 0.45, 460);
  var dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWheel(wheelAngle);
}

function drawWheel(angle) {
  var size = parseFloat(canvas.style.width) || 320;
  var r = size / 2 - 8;
  var cx = size / 2;
  var cy = size / 2;
  var n = prizes.length;
  var arc = (Math.PI * 2) / n;

  ctx.clearRect(0, 0, size, size);

  for (var i = 0; i < n; i++) {
    var startA = angle + i * arc;
    var endA = startA + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startA, endA);
    ctx.closePath();
    ctx.fillStyle = wheelColors[i % wheelColors.length];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + arc / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.max(14, Math.floor(r * 0.13)) + 'px sans-serif';
    ctx.fillText(prizes[i], r - 14, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(cx, 2);
  ctx.lineTo(cx - 14, 26);
  ctx.lineTo(cx + 14, 26);
  ctx.closePath();
  ctx.fillStyle = '#ffd700';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();
}

btnRoulette.addEventListener('click', function(e) {
  e.stopPropagation();
  closeAll();
  resultEl.textContent = '';
  spinBtn.disabled = false;
  rlOverlay.classList.add('show');
  resizeWheel();
  setReturnTimer(CONFIG.rouletteIdleMs);
});

document.getElementById('roulette-close').addEventListener('click', function(e) {
  e.stopPropagation();
  closeAll();
});

spinBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  if (spinning || prizes.length === 0) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = '';

  var startAngle = wheelAngle;
  var extraSpins = (5 + Math.floor(Math.random() * 4)) * Math.PI * 2;
  var randomOffset = Math.random() * Math.PI * 2;
  var targetAngle = startAngle + extraSpins + randomOffset;
  var duration = 3600;
  var startTime = performance.now();

  function animate(now) {
    var elapsed = now - startTime;
    var t = Math.min(elapsed / duration, 1);
    var easeOut = 1 - Math.pow(1 - t, 3);
    wheelAngle = startAngle + (targetAngle - startAngle) * easeOut;
    drawWheel(wheelAngle);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      var n = prizes.length;
      var arc = (Math.PI * 2) / n;
      var pointerAngle = ((-Math.PI / 2 - wheelAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var idx = Math.floor(pointerAngle / arc) % n;
      resultEl.textContent = prizes[idx];
      setReturnTimer(CONFIG.resultTimeoutMs);
    }
  }
  requestAnimationFrame(animate);
});

window.addEventListener('resize', function() {
  if (rlOverlay.classList.contains('show')) resizeWheel();
});
</script>
</body>
</html>
