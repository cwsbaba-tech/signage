<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background:#111; overflow:hidden;
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* 画面全体を3エリアに分ける（上の黒い窓なし） */
#stage {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#111; overflow:hidden;
}

.slide {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.6s ease-in-out; transition:opacity 0.6s ease-in-out;
}
/* ロゴ（スクリーン4と同じ：黒背景に全体表示） */
.slide.contain { background-color:#000; background-size:contain; }
/* 動画 */
video.slide { object-fit:cover; background:#000; }

/* 1. 上（上 1/3）：お会計（カスタマーディスプレイを開く） */
#tapTop {
  position:absolute; top:0; left:0; right:0; height:33.333%; z-index:15;
  cursor:pointer;
}
/* 2. 左（下 2/3 の左半分）：PayPay QR */
#tapLeft {
  position:absolute; top:33.333%; bottom:0; left:0; width:50%; z-index:15;
  cursor:pointer;
}
/* 3. 右（下 2/3 の右半分）：ナカペイ QR */
#tapRight {
  position:absolute; top:33.333%; bottom:0; right:0; width:50%; z-index:15;
  cursor:pointer;
}

/* フルスクリーン復帰ボタン（右上） */
#btn-fs {
  position:fixed; top:8px; right:8px; z-index:200;
  padding:5px 10px;
  font-family:inherit; font-size:12px; font-weight:700;
  color:#fff; background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.45); border-radius:6px;
  cursor:pointer;
}

/* 期間限定バナー */
#banner {
  position:absolute; top:0; left:0; right:0; z-index:20;
  padding:8px 12px; text-align:center;
  font-size:18px; font-weight:700; color:#fff;
  background:rgba(180,20,40,0.88); border-bottom:2px solid #ffd700;
  display:none;
  pointer-events:none;
}

/* ルーレット用ボタンバー（期間中のみ表示） */
#bar {
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  display:none; text-align:center;
  padding:10px;
  background:rgba(5,10,15,0.88); border-top:2px solid #00b4d8;
}
.btn {
  padding:10px 24px;
  font-family:inherit; font-size:20px; font-weight:700;
  color:#fff; border:2px solid #ffd700; border-radius:12px; background:#b8860b;
  cursor:pointer;
}
#btn-roulette { display:none; }

/* オーバーレイ（QR・ルーレット） */
.overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.94);
  display:none;
  text-align:center; color:#fff;
  padding:44px 14px 16px;
  box-sizing:border-box;
}
.close-btn {
  position:absolute; top:10px; right:12px; z-index:130;
  padding:6px 14px;
  font-size:16px; font-weight:700;
  font-family:inherit; color:#fff; background:#444; border:2px solid #888; border-radius:8px;
  cursor:pointer;
}
.ov-title { font-size:24px; font-weight:700; margin:4px 0 12px; }
.ov-sub   { font-size:14px; color:#caf0f8; margin:8px auto 0; }

/* QRを画面中央に配置 */
#qr-center {
  position:relative;
  top:50%;
  -webkit-transform:translateY(-50%);
  transform:translateY(-50%);
  z-index:125;
  pointer-events:none;
}
#qr-card {
  display:inline-block; background:#fff; padding:10px; border-radius:10px;
}
#qr-img {
  display:block; width:170px; height:170px; object-fit:contain;
}

/* QR画面でも上 1/3 をタップでお会計へ移動 */
#qrTop {
  position:absolute; top:0; left:0; right:0; height:33.333%; z-index:120;
  cursor:pointer;
}
/* QR画面の下 2/3 は左右タップで PayPay / ナカペイ 切り替え */
#qrLeft  { position:absolute; top:33.333%; bottom:0; left:0; width:50%; z-index:110; cursor:pointer; }
#qrRight { position:absolute; top:33.333%; bottom:0; right:0; width:50%; z-index:110; cursor:pointer; }

#wheel { display:inline-block; }
#roulette-result {
  min-height:32px; margin-top:8px;
  font-size:22px; font-weight:700; color:#ffd700;
}

/* スタート画面 */
#startOverlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:#000; color:#fff;
  z-index:9999; text-align:center; padding-top:35vh; box-sizing:border-box; cursor:pointer;
}
#startOverlay h1 { font-size:28px; margin:0 0 12px; color:#00b4d8; }
#startOverlay p  { font-size:16px; opacity:0.7; margin:0; }
</style>
</head>
<body>

<button type="button" id="btn-fs" onclick="forceFullscreen(event)">全画面</button>

<div id="startOverlay" onclick="handleStartTap()">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<div id="stage">
  <div id="tapTop" onclick="openCheckout()"></div>
  <div id="tapLeft" onclick="showQr('paypay')"></div>
  <div id="tapRight" onclick="showQr('nakapay')"></div>

  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btn-roulette" onclick="openRoulette()">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qr-overlay">
  <button class="close-btn" onclick="closeAll()">戻る</button>
  <div id="qrTop" onclick="openCheckout()"></div>
  <div id="qrLeft" onclick="showQr('paypay')"></div>
  <div id="qrRight" onclick="showQr('nakapay')"></div>
  <div id="qr-center">
    <p class="ov-title" id="qr-title">PayPay</p>
    <div id="qr-card"><img id="qr-img" src="qr_paypay.png" alt="QR"></div>
    <p class="ov-sub">スマートフォンでスキャンしてお支払いください</p>
    <p class="ov-sub">上をタップでお会計画面へ進みます</p>
  </div>
</div>

<div class="overlay" id="roulette-overlay">
  <button class="close-btn" onclick="closeAll()">閉じる</button>
  <p class="ov-title">ルーレット</p>
  <canvas id="wheel" width="220" height="220"></canvas>
  <div style="margin-top:10px;"><button class="btn" id="spin-btn" onclick="spinWheel()">スタート</button></div>
  <div id="roulette-result"></div>
</div>

<script>
var CONFIG = {
  checkoutUrl     : 'http://192.168.0.115:55556',
  cycleMs         : 60000,
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qrPaypay        : 'qr_paypay.png',
  qrNakapay       : 'qr_nakapay.png',
  sound           : false,   /* true にすると動画の音を出す（レジ横なので通常は false） */
  fullscreenAndroid : true     /* Androidではタップでフルスクリーンにする */
};

/* ============================================================
   普段のサイネージ（60秒サイクル・10秒ごとの切り替え例）
   type: image=静止画 / video=動画
   ============================================================ */
var PARTS = [
  { id:'p1', type:'image', src:'calendar.jpg',    offset:0     },
  { id:'p2', type:'video', src:'video_a.mp4',     offset:10000 },
  { id:'p3', type:'image', src:'holiday.jpg',     offset:20000 },
  { id:'p4', type:'video', src:'video_b.mp4',     offset:30000 },
  { id:'p5', type:'video', src:'video_c.mp4',     offset:40000 },
  { id:'p6', type:'image', src:'トリックロゴ.jpg', offset:50000, contain:true }
];

var stage = document.getElementById('stage');

function createImageSlide(part) {
  var el = document.createElement('div');
  el.id = part.id;
  el.className = 'slide' + (part.contain ? ' contain' : '');
  el.style.backgroundImage = "url('" + encodeURI(part.src) + "')";
  stage.insertBefore(el, stage.firstChild);
  return el;
}

function createVideoSlide(part) {
  var v = document.createElement('video');
  v.id = part.id;
  v.className = 'slide';
  v.muted = !CONFIG.sound;
  if (!CONFIG.sound) v.setAttribute('muted', '');
  v.setAttribute('playsinline', '');
  v.setAttribute('webkit-playsinline', '');
  v.preload = 'metadata';
  v.loop = false;
  v.src = encodeURI(part.src);
  stage.insertBefore(v, stage.firstChild);
  return v;
}

var i0;
for (i0 = 0; i0 < PARTS.length; i0++) {
  PARTS[i0].el = (PARTS[i0].type === 'video') ? createVideoSlide(PARTS[i0]) : createImageSlide(PARTS[i0]);
}

function startVideoFromBeginning(v) {
  try {
    if (v.readyState >= 1) {
      v.currentTime = 0;
    }
  } catch (e) {}
  try {
    var pr = v.play();
    if (pr && pr.catch) pr.catch(function() {});
  } catch (e2) {}
}

var started = false;
var lastPartId = '';

function getPart(offset) {
  var found = PARTS[0];
  for (var i = 0; i < PARTS.length; i++) {
    if (offset >= PARTS[i].offset) found = PARTS[i];
  }
  return found;
}

function tick() {
  if (!started) return;
  var offset = new Date().getTime() % CONFIG.cycleMs;
  var part = getPart(offset);
  if (part.id === lastPartId) return;
  lastPartId = part.id;

  for (var i = 0; i < PARTS.length; i++) {
    var p = PARTS[i];
    if (p.id === part.id) {
      p.el.style.opacity = '1';
      if (p.type === 'video') startVideoFromBeginning(p.el);
    } else {
      p.el.style.opacity = '0';
      if (p.type === 'video') {
        try { p.el.pause(); } catch (e) {}
      }
    }
  }
}
setInterval(tick, 200);

var preload1 = new Image(); preload1.src = CONFIG.qrPaypay;
var preload2 = new Image(); preload2.src = CONFIG.qrNakapay;

var qrOverlay = document.getElementById('qr-overlay');
var rlOverlay = document.getElementById('roulette-overlay');
var returnTimer = null;

function closeAll() {
  qrOverlay.style.display = 'none';
  rlOverlay.style.display = 'none';
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}
function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

function isAlreadyStarted() {
  try {
    return window.name && window.name.indexOf('SCREEN5_STARTED') !== -1;
  } catch (e) {
    return false;
  }
}

function markStarted() {
  try {
    window.name = 'SCREEN5_STARTED|' + location.href;
  } catch (e) {}
}

function openCheckout() {
  if (!started) return;
  markStarted();
  window.location.href = CONFIG.checkoutUrl;
}

function showQr(kind) {
  if (!started) return;
  closeAll();
  if (kind === 'paypay') {
    document.getElementById('qr-title').textContent = 'PayPay';
    document.getElementById('qr-img').src = CONFIG.qrPaypay;
  } else {
    document.getElementById('qr-title').textContent = 'ナカペイ';
    document.getElementById('qr-img').src = CONFIG.qrNakapay;
  }
  qrOverlay.style.display = 'block';
  setReturnTimer(CONFIG.qrTimeoutMs);
}

function isAndroid() {
  return /Android/i.test(navigator.userAgent);
}

function requestFs() {
  if (!CONFIG.fullscreenAndroid || !isAndroid()) return;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  var el = document.documentElement;
  try {
    if (el.requestFullscreen) {
      var pr = el.requestFullscreen();
      if (pr && pr.catch) pr.catch(function() {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  } catch (e) {}
}

function forceFullscreen(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  var el = document.documentElement;
  try {
    if (el.requestFullscreen) {
      var pr = el.requestFullscreen();
      if (pr && pr.catch) pr.catch(function() {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    }
  } catch (err) {}
}

function activateSignage() {
  if (started) return;
  started = true;
  markStarted();
  document.getElementById('startOverlay').style.display = 'none';
  lastPartId = '';
  tick();
  loadEvents();
}

function handleStartTap() {
  requestFs();
  activateSignage();
}

if (isAlreadyStarted()) {
  activateSignage();
}

/* イベント読み込み（events.txt） */
var prizeFile = '';
var bannerEl = document.getElementById('banner');
var barEl = document.getElementById('bar');
var btnRoulette = document.getElementById('btn-roulette');

function pad2(n) { return (n < 10) ? ('0' + n) : ('' + n); }
function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function trimStr(s) {
  return s.replace(/^\s+|\s+$/g, '');
}

function parseEvents(rawText) {
  var today = getToday();
  var lines = rawText.split(/\r?\n/);
  var firstBanner = '';
  prizeFile = '';

  for (var i = 0; i < lines.length; i++) {
    var line = trimStr(lines[i]);
    if (line.length === 0 || line.charAt(0) === '#') continue;
    var cols = line.split('|');
    if (cols.length < 4) continue;
    var start = trimStr(cols[0]);
    var end   = trimStr(cols[1]);
    var type  = trimStr(cols[2]);
    var val   = trimStr(cols[3]);
    if (today >= start && today <= end) {
      if (type === 'banner' && !firstBanner) firstBanner = val;
      if (type === 'roulette') prizeFile = val;
    }
  }

  if (firstBanner) {
    bannerEl.textContent = firstBanner;
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  if (prizeFile) {
    btnRoulette.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(prizeFile);
  } else {
    btnRoulette.style.display = 'none';
    barEl.style.display = 'none';
  }
}

function loadEvents() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'events.txt?t=' + new Date().getTime(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
        if (xhr.responseText) parseEvents(xhr.responseText);
      }
    };
    xhr.send(null);
  } catch (e) {}
}

/* ルーレット */
var prizes = ['あたり', 'はずれ', 'もう1回', 'プチ賞'];
var wheelAngle = 0;
var spinning = false;
var wheelColors = ['#c1121f', '#1d3557', '#2a9d8f', '#e9c46a', '#6a4c93', '#f77f00'];

function loadPrizes(filename) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', filename + '?t=' + new Date().getTime(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0) && xhr.responseText) {
        var raw = xhr.responseText.split(/\r?\n/);
        var list = [];
        for (var i = 0; i < raw.length; i++) {
          var s = trimStr(raw[i]);
          if (s.length > 0) list.push(s);
        }
        if (list.length > 0) {
          prizes = list;
          drawWheel(wheelAngle);
        }
      }
    };
    xhr.send(null);
  } catch (e) {}
}

function drawWheel(angle) {
  var canvas = document.getElementById('wheel');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var size = canvas.width;
  var r = size / 2 - 6;
  var cx = size / 2;
  var cy = size / 2;
  var n = prizes.length;
  var arc = (Math.PI * 2) / n;

  ctx.clearRect(0, 0, size, size);
  for (var i = 0; i < n; i++) {
    var startA = angle + i * arc;
    var endA = startA + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startA, endA, false);
    ctx.closePath();
    ctx.fillStyle = wheelColors[i % wheelColors.length];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + arc / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(prizes[i], r - 10, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(cx, 2);
  ctx.lineTo(cx - 10, 18);
  ctx.lineTo(cx + 10, 18);
  ctx.closePath();
  ctx.fillStyle = '#ffd700';
  ctx.fill();
}

function openRoulette() {
  if (!started) return;
  closeAll();
  document.getElementById('roulette-result').textContent = '';
  drawWheel(wheelAngle);
  rlOverlay.style.display = 'block';
  setReturnTimer(CONFIG.rouletteIdleMs);
}

function spinWheel() {
  if (spinning || prizes.length === 0) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('roulette-result').textContent = '';

  var startAngle = wheelAngle;
  var extraSpins = (5 + Math.floor(Math.random() * 4)) * Math.PI * 2;
  var targetAngle = startAngle + extraSpins + Math.random() * Math.PI * 2;
  var duration = 3600;
  var startTime = new Date().getTime();

  var timer = setInterval(function() {
    var elapsed = new Date().getTime() - startTime;
    var t = elapsed / duration;
    if (t > 1) t = 1;
    var easeOut = 1 - Math.pow(1 - t, 3);
    wheelAngle = startAngle + (targetAngle - startAngle) * easeOut;
    drawWheel(wheelAngle);

    if (t >= 1) {
      clearInterval(timer);
      spinning = false;
      document.getElementById('spin-btn').disabled = false;
      var n = prizes.length;
      var arc = (Math.PI * 2) / n;
      var pointerAngle = ((-Math.PI / 2 - wheelAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var idx = Math.floor(pointerAngle / arc) % n;
      document.getElementById('roulette-result').textContent = prizes[idx];
      setReturnTimer(CONFIG.resultTimeoutMs);
    }
  }, 25);
}
</script>
</body>
</html>
