<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background:#000; overflow:hidden;
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#stage { position:fixed; top:0; left:0; right:0; bottom:0; }

/* 待機中スライド */
.slide {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.6s ease-in-out; transition:opacity 0.6s ease-in-out;
}

/* 左右タップ用の透明エリア */
#tap-left, #tap-right {
  position:absolute; top:0; bottom:0; width:50%; z-index:10;
  cursor:pointer;
}
#tap-left  { left:0; }
#tap-right { right:0; }

/* 期間限定バナー（上部） */
#banner {
  position:absolute; top:0; left:0; right:0; z-index:20;
  padding:12px 20px; text-align:center;
  font-size:24px; font-weight:700; color:#fff;
  background:rgba(180,20,40,0.9); border-bottom:3px solid #ffd700;
  display:none;
}

/* 下部ボタンバー（通常は非表示・ルーレット期間中のみ表示） */
#bar {
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  display:none; text-align:center;
  padding:14px 20px;
  background:rgba(5,10,15,0.9); border-top:3px solid #00b4d8;
}
.btn {
  min-width:160px; padding:12px 24px;
  font-family:inherit; font-size:22px; font-weight:700;
  color:#fff; border:2px solid #fff; border-radius:10px; background:#222;
  cursor:pointer;
}
.btn:active { opacity:0.7; }
#btn-roulette { background:#b8860b; border-color:#ffd700; display:none; }

/* 共通オーバーレイ */
.overlay {
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.94);
  display:none; text-align:center; color:#fff;
  padding-top:40px;
}
.close-btn {
  position:absolute; top:14px; right:14px; z-index:120;
  padding:10px 22px; font-size:20px; font-weight:700;
  font-family:inherit; color:#fff; background:#444; border:2px solid #888; border-radius:8px;
  cursor:pointer;
}
.ov-title { font-size:32px; font-weight:700; margin:0 0 16px; }
.ov-sub   { font-size:18px; color:#caf0f8; margin:12px 0 0; }

/* QR */
#qr-card {
  display:inline-block; background:#fff; padding:14px; border-radius:12px;
}
#qr-img {
  display:block; width:240px; height:240px;
}
@media (min-width: 700px) {
  #qr-img { width:420px; height:420px; }
  .ov-title { font-size:44px; }
  .ov-sub { font-size:26px; }
}

/* ルーレット */
#wheel-wrap { position:relative; display:inline-block; }
#wheel { display:block; margin:0 auto; }
#spin-btn { margin-top:14px; background:#b8860b; border-color:#ffd700; display:inline-block; }
#roulette-result {
  min-height:40px; margin-top:12px;
  font-size:28px; font-weight:700; color:#ffd700;
}

/* スタート */
#startOverlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:#000; color:#fff;
  z-index:9999; cursor:pointer; text-align:center;
  padding-top:35vh;
}
#startOverlay h1 { font-size:32px; margin:0 0 14px; color:#00b4d8; }
#startOverlay p  { font-size:18px; opacity:0.7; margin:0; }
</style>
</head>
<body>

<div id="startOverlay" onclick="startApp()">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<div id="stage">
  <div id="slide1" class="slide" style="background-image:url('calendar.jpg');"></div>
  <div id="slide2" class="slide" style="background-image:url('free1_01.png');"></div>
  <div id="slide3" class="slide" style="background-image:url('holiday.jpg');"></div>
  <div id="slide4" class="slide" style="background-image:url('free2_01.jpg');"></div>
  <div id="slide5" class="slide" style="background-image:url('event.jpg');"></div>
  <div id="slide6" class="slide" style="background-image:url('横長ロゴ.jpg');"></div>

  <div id="tap-left" onclick="showQr('paypay')"></div>
  <div id="tap-right" onclick="showQr('nakapay')"></div>
  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btn-roulette" onclick="openRoulette()">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qr-overlay">
  <button class="close-btn" onclick="closeAll()">戻る</button>
  <div id="qr-tap-left" style="position:absolute;top:0;bottom:0;left:0;width:50%;z-index:110;" onclick="showQr('paypay')"></div>
  <div id="qr-tap-right" style="position:absolute;top:0;bottom:0;right:0;width:50%;z-index:110;" onclick="showQr('nakapay')"></div>
  <p class="ov-title" id="qr-title">PayPay</p>
  <div id="qr-card"><img id="qr-img" src="qr_paypay.png" alt="QR"></div>
  <p class="ov-sub">スマートフォンでスキャンしてお支払いください</p>
  <p class="ov-sub">金額はレジの画面でご確認ください</p>
</div>

<div class="overlay" id="roulette-overlay">
  <button class="close-btn" onclick="closeRoulette()">閉じる</button>
  <p class="ov-title" id="roulette-title">ルーレット</p>
  <div id="wheel-wrap"><canvas id="wheel"></canvas></div>
  <div><button class="btn" id="spin-btn" onclick="spinWheel()">スタート</button></div>
  <div id="roulette-result"></div>
</div>

<script>
var CONFIG = {
  cycleMs         : 59900,
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qrPaypay        : 'qr_paypay.png',
  qrNakapay       : 'qr_nakapay.png'
};

var started = false;
var lastSlide = 0;

function tick() {
  if (!started) return;
  var offset = Date.now() % CONFIG.cycleMs;
  var current = 1;
  if (offset >= 50000) current = 6;
  else if (offset >= 40000) current = 5;
  else if (offset >= 30000) current = 4;
  else if (offset >= 20000) current = 3;
  else if (offset >= 10000) current = 2;

  if (current === lastSlide) return;
  lastSlide = current;

  for (var i = 1; i <= 6; i++) {
    var el = document.getElementById('slide' + i);
    if (el) el.style.opacity = (i === current) ? '1' : '0';
  }
}
setInterval(tick, 200);

var qrOverlay = document.getElementById('qr-overlay');
var rlOverlay = document.getElementById('roulette-overlay');
var returnTimer = null;

function closeAll() {
  qrOverlay.style.display = 'none';
  rlOverlay.style.display = 'none';
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}
function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

/* QR事前読み込み */
var img1 = new Image(); img1.src = CONFIG.qrPaypay;
var img2 = new Image(); img2.src = CONFIG.qrNakapay;

function showQr(kind) {
  if (!started) return;
  closeAll();
  if (kind === 'paypay') {
    document.getElementById('qr-title').innerHTML = 'PayPay';
    document.getElementById('qr-img').src = CONFIG.qrPaypay;
  } else {
    document.getElementById('qr-title').innerHTML = 'ナカペイ';
    document.getElementById('qr-img').src = CONFIG.qrNakapay;
  }
  qrOverlay.style.display = 'block';
  setReturnTimer(CONFIG.qrTimeoutMs);
}

/* イベント・ルーレット管理 */
var activeBanners = new Array();
var bannerIdx = 0;
var activeRoulette = null;
var bannerEl = document.getElementById('banner');
var barEl = document.getElementById('bar');
var btnRoulette = document.getElementById('btn-roulette');

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function applyEvents(text) {
  var lines = text.split(/\r?\n/);
  var today = todayStr();
  activeBanners = new Array();
  activeRoulette = null;

  for (var i = 0; i < lines.length; i++) {
    var l = lines.slice(i, i + 1).join('').replace(/^\s+|\s+$/g, '');
    if (!l || l.charAt(0) === '#' || l.indexOf('|') === -1) continue;
    var cols = l.split('|');
    if (cols.length < 4) continue;
    var start = cols.slice(0, 1).join('').replace(/^\s+|\s+$/g, '');
    var end   = cols.slice(1, 2).join('').replace(/^\s+|\s+$/g, '');
    var type  = cols.slice(2, 3).join('').replace(/^\s+|\s+$/g, '');
    var val   = cols.slice(3, 4).join('').replace(/^\s+|\s+$/g, '');
    if (today >= start && today <= end) {
      if (type === 'banner') activeBanners.push(val);
      if (type === 'roulette') activeRoulette = val;
    }
  }

  if (activeBanners.length > 0) {
    bannerEl.innerHTML = activeBanners.slice(0, 1).join('');
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  if (activeRoulette) {
    btnRoulette.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(activeRoulette);
  } else {
    btnRoulette.style.display = 'none';
    barEl.style.display = 'none';
  }
}

setInterval(function() {
  if (activeBanners.length > 1) {
    bannerIdx = (bannerIdx + 1) % activeBanners.length;
    bannerEl.innerHTML = activeBanners.slice(bannerIdx, bannerIdx + 1).join('');
  }
}, 5000);

function loadEvents() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'events.txt?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
        if (xhr.responseText) applyEvents(xhr.responseText);
      }
    };
    xhr.send();
  } catch (e) {}
}

/* ルーレット */
var PRIZES = new Array('1等', '2等', '3等', '参加賞');
var COLORS = new Array('#e63946', '#457b9d', '#2a9d8f', '#e9c46a', '#f4a261', '#8338ec');
var wheelCanvas = document.getElementById('wheel');
var ctx = wheelCanvas.getContext('2d');
var currentAngle = 0;
var isSpinning = false;

function loadPrizes(filename) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', filename + '?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) {
        if (xhr.responseText) {
          var raw = xhr.responseText.split(/\r?\n/);
          var list = new Array();
          for (var i = 0; i < raw.length; i++) {
            var s = raw.slice(i, i + 1).join('').replace(/^\s+|\s+$/g, '');
            if (s && s.charAt(0) !== '#') list.push(s);
          }
