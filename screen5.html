<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

#startOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  color: #fff;
  z-index: 9999;
  text-align: center;
  padding-top: 35vh;
  cursor: pointer;
}
#startOverlay h1 { font-size: 36px; margin: 0 0 16px; color: #00b4d8; }
#startOverlay p  { font-size: 20px; opacity: 0.7; margin: 0; }

#stage {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
}

.slide {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 0.6s ease-in-out;
}

#tapLeft {
  position: absolute;
  top: 0; bottom: 0; left: 0; width: 50%;
  z-index: 10;
  cursor: pointer;
}
#tapRight {
  position: absolute;
  top: 0; bottom: 0; right: 0; width: 50%;
  z-index: 10;
  cursor: pointer;
}

#banner {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 20;
  padding: 14px 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  color: #fff;
  background: rgba(180, 20, 40, 0.9);
  border-bottom: 3px solid #ffd700;
  display: none;
}

#bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  padding: 14px 20px;
  text-align: center;
  background: rgba(5, 10, 15, 0.9);
  border-top: 3px solid #00b4d8;
  display: none;
}

.btn {
  padding: 14px 36px;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  background: #b8860b;
  border: 2px solid #ffd700;
  border-radius: 10px;
  cursor: pointer;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.94);
  color: #fff;
  text-align: center;
  padding-top: 40px;
  display: none;
}

.closeBtn {
  position: absolute;
  top: 16px; right: 16px;
  z-index: 120;
  padding: 12px 26px;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  background: #444;
  border: 2px solid #888;
  border-radius: 8px;
  cursor: pointer;
}

.ovTitle { font-size: 38px; font-weight: bold; margin: 0 0 16px; }
.ovSub   { font-size: 20px; color: #caf0f8; margin: 12px 0 0; }

#qrCard {
  display: inline-block;
  background: #fff;
  padding: 16px;
  border-radius: 12px;
}
#qrImg {
  display: block;
  width: 320px;
  height: 320px;
}

#qrLeft {
  position: absolute;
  top: 0; bottom: 0; left: 0; width: 50%;
  z-index: 110;
}
#qrRight {
  position: absolute;
  top: 0; bottom: 0; right: 0; width: 50%;
  z-index: 110;
}

#wheel { display: block; margin: 0 auto; }
#rouletteResult {
  min-height: 44px;
  margin-top: 14px;
  font-size: 32px;
  font-weight: bold;
  color: #ffd700;
}
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<div id="stage">
  <div id="p1" class="slide" style="background-image:url('calendar.jpg');"></div>
  <div id="p2" class="slide" style="background-image:url('free1_01.png');"></div>
  <div id="p3" class="slide" style="background-image:url('holiday.jpg');"></div>
  <div id="p4" class="slide" style="background-image:url('free2_01.jpg');"></div>
  <div id="p5" class="slide" style="background-image:url('event.jpg');"></div>
  <div id="p6" class="slide" style="background-image:url('横長ロゴ.jpg');"></div>

  <div id="tapLeft"></div>
  <div id="tapRight"></div>

  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btnRoulette">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qrOverlay">
  <button class="closeBtn" id="qrClose">戻る</button>
  <div id="qrLeft"></div>
  <div id="qrRight"></div>
  <p class="ovTitle" id="qrTitle">PayPay</p>
  <div id="qrCard"><img id="qrImg" src="qr_paypay.png" alt="QR"></div>
  <p class="ovSub">スマートフォンでスキャンしてお支払いください</p>
  <p class="ovSub">金額はレジの画面でご確認ください</p>
</div>

<div class="overlay" id="rouletteOverlay">
  <button class="closeBtn" id="rouletteClose">閉じる</button>
  <p class="ovTitle">ルーレット</p>
  <canvas id="wheel" width="320" height="320"></canvas>
  <div style="margin-top:16px;"><button class="btn" id="spinBtn">スタート</button></div>
  <div id="rouletteResult"></div>
</div>

<script>
var cycleMs = 59900;
var qrTimeoutMs = 60000;
var rouletteIdleMs = 90000;
var resultTimeoutMs = 15000;

var qrPaypayFile = 'qr_paypay.png';
var qrNakapayFile = 'qr_nakapay.png';

var started = false;
var lastPart = 0;
var returnTimer = null;

var preload1 = new Image();
preload1.src = qrPaypayFile;
var preload2 = new Image();
preload2.src = qrNakapayFile;

function tick() {
  if (!started) return;
  var offset = Date.now() % cycleMs;
  var part = 1;
  if (offset >= 50000) { part = 6; }
  else if (offset >= 40000) { part = 5; }
  else if (offset >= 30000) { part = 4; }
  else if (offset >= 20000) { part = 3; }
  else if (offset >= 10000) { part = 2; }

  if (part === lastPart) return;
  lastPart = part;

  document.getElementById('p1').style.opacity = (part === 1) ? '1' : '0';
  document.getElementById('p2').style.opacity = (part === 2) ? '1' : '0';
  document.getElementById('p3').style.opacity = (part === 3) ? '1' : '0';
  document.getElementById('p4').style.opacity = (part === 4) ? '1' : '0';
  document.getElementById('p5').style.opacity = (part === 5) ? '1' : '0';
  document.getElementById('p6').style.opacity = (part === 6) ? '1' : '0';
}
setInterval(tick, 100);

function closeAll() {
  document.getElementById('qrOverlay').style.display = 'none';
  document.getElementById('rouletteOverlay').style.display = 'none';
  if (returnTimer) {
    clearTimeout(returnTimer);
    returnTimer = null;
  }
}

function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

function showPaypay() {
  if (!started) return;
  closeAll();
  document.getElementById('qrTitle').textContent = 'PayPay';
  document.getElementById('qrImg').src = qrPaypayFile;
  document.getElementById('qrOverlay').style.display = 'block';
  setReturnTimer(qrTimeoutMs);
}

function showNakapay() {
  if (!started) return;
  closeAll();
  document.getElementById('qrTitle').textContent = 'ナカペイ';
  document.getElementById('qrImg').src = qrNakapayFile;
  document.getElementById('qrOverlay').style.display = 'block';
  setReturnTimer(qrTimeoutMs);
}

document.getElementById('startOverlay').addEventListener('click', function() {
  document.getElementById('startOverlay').style.display = 'none';
  started = true;
  tick();
  loadEvents();
});

document.getElementById('tapLeft').addEventListener('click', showPaypay);
document.getElementById('tapRight').addEventListener('click', showNakapay);
document.getElementById('qrLeft').addEventListener('click', showPaypay);
document.getElementById('qrRight').addEventListener('click', showNakapay);
document.getElementById('qrClose').addEventListener('click', closeAll);

/* イベント読み込み（events.txt） */
var bannerList = '';
var bannerCount = 0;
var bannerIndex = 0;
var prizeFile = '';

function pad2(n) {
  return (n < 10) ? ('0' + n) : ('' + n);
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function parseEvents(rawText) {
  var today = getToday();
  var lines = rawText.split('\n');
  var foundBanners = '';
  var count = 0;
  prizeFile = '';

  for (var i = 0; i < lines.length; i++) {
    var line = lines.slice(i, i + 1).join('').trim();
    if (line.length === 0) continue;
    if (line.charAt(0) === '#') continue;

    var p1 = line.indexOf('|');
    if (p1 === -1) continue;
    var p2 = line.indexOf('|', p1 + 1);
    if (p2 === -1) continue;
    var p3 = line.indexOf('|', p2 + 1);
    if (p3 === -1) continue;

    var start = line.substring(0, p1).trim();
    var end   = line.substring(p1 + 1, p2).trim();
    var type  = line.substring(p2 + 1, p3).trim();
    var val   = line.substring(p3 + 1).trim();

    if (today >= start && today <= end) {
      if (type === 'banner') {
        if (count > 0) foundBanners += '|||';
        foundBanners += val;
        count++;
      }
      if (type === 'roulette') {
        prizeFile = val;
      }
    }
  }

  bannerList = foundBanners;
  bannerCount = count;

  var bannerEl = document.getElementById('banner');
  if (bannerCount > 0) {
    var firstEnd = bannerList.indexOf('|||');
    bannerEl.textContent = (firstEnd === -1) ? bannerList : bannerList.substring(0, firstEnd);
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  var barEl = document.getElementById('bar');
  var btnEl = document.getElementById('btnRoulette');
  if (prizeFile !== '') {
    btnEl.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(prizeFile);
  } else {
    btnEl.style.display = 'none';
    barEl.style.display = 'none';
  }
}

function loadEvents() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'events.txt?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200 || xhr.status === 0) {
        if (xhr.responseText) {
          parseEvents(xhr.responseText);
        }
      }
    }
  };
  xhr.send();
}
setInterval(loadEvents, 60000);

/* ルーレット処理 */
var prizesData = '1等|||2等|||3等|||参加賞';
var prizeCount = 4;
var currentAngle = 0;
var spinning = false;

function getPrizeAt(idx) {
  var parts = prizesData.split('|||');
  return parts.slice(idx, idx + 1).join('');
}

function getColorAt(idx) {
  var mod = idx % 6;
  if (mod === 0) return '#e63946';
  if (mod === 1) return '#457b9d';
  if (mod === 2) return '#2a9d8f';
  if (mod === 3) return '#e9c46a';
  if (mod === 4) return '#f4a261';
  return '#8338ec';
}

function loadPrizes(file) {
