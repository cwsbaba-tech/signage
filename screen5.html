<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background:#111; overflow:hidden;
  font-family:'Hiragino Kaku Gothic ProN',sans-serif;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* 上部 1/4（25%）：お会計枠（タップでカスタマーディスプレイへ） */
#customer-top {
  position:absolute; top:0; left:0; right:0; height:25%; z-index:40;
  background:#18222f;
  border-bottom:2px solid #00b4d8;
  box-sizing:border-box;
  text-align:center;
  color:#fff;
  cursor:pointer;
}
#customer-top-inner {
  position:relative; top:50%;
  margin-top:-22px;
  padding:0 10px;
}
#customer-top-title {
  font-size:16px; font-weight:700; color:#ffd700;
  margin:0 0 4px;
}
#customer-top-sub {
  font-size:12px; color:#caf0f8;
  margin:0;
}

/* 下部 3/4（75%）：サイネージ・QR・ルーレット領域 */
#lower-area {
  position:absolute; top:25%; left:0; right:0; bottom:0; z-index:10;
  background:#111;
  overflow:hidden;
}
#stage { position:absolute; top:0; left:0; right:0; bottom:0; background:#111; }

.slide {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background-size:cover; background-position:center center; background-repeat:no-repeat;
  opacity:0;
  -webkit-transition:opacity 0.6s ease-in-out; transition:opacity 0.6s ease-in-out;
}

#banner {
  position:absolute; top:0; left:0; right:0; z-index:20;
  padding:8px 12px; text-align:center;
  font-size:18px; font-weight:700; color:#fff;
  background:rgba(180,20,40,0.88); border-bottom:2px solid #ffd700;
  display:none;
}

#bar {
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  display:none; text-align:center;
  padding:10px;
  background:rgba(5,10,15,0.88); border-top:2px solid #00b4d8;
}
.btn {
  padding:10px 20px;
  font-family:inherit; font-size:18px; font-weight:700;
  color:#fff; border:2px solid #fff; border-radius:12px; background:#222;
}
#btn-roulette { background:#b8860b; border-color:#ffd700; display:none; }

.overlay {
  position:absolute; top:0; left:0; right:0; bottom:0; z-index:100;
  background:rgba(0,0,0,0.94);
  display:none;
  text-align:center; color:#fff;
  padding:38px 12px 12px;
  box-sizing:border-box;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.close-btn {
  position:absolute; top:8px; right:10px; z-index:110;
  padding:5px 12px;
  font-size:14px; font-weight:700;
  font-family:inherit; color:#fff; background:#444; border:2px solid #888; border-radius:8px;
}
.ov-title { font-size:22px; font-weight:700; margin:4px 0 8px; }
.ov-sub { font-size:13px; line-height:1.4; color:#caf0f8; margin:6px auto 0; max-width:92%; }

#qr-card {
  display:inline-block;
  background:#fff;
  padding:8px;
  border-radius:10px;
  box-sizing:border-box;
}
#qr-img { display:block; width:150px; height:150px; object-fit:contain; }

#wheel-wrap { position:relative; }
#wheel { display:inline-block; }
#spin-btn { margin-top:10px; background:#b8860b; border-color:#ffd700; }
#roulette-result { min-height:32px; margin-top:8px; font-size:22px; font-weight:700; color:#ffd700; }

#startOverlay {
  position:fixed; top:0; left:0; right:0; bottom:0; background:#000; color:#fff;
  z-index:9999; text-align:center; padding-top:35%; box-sizing:border-box;
}
#startOverlay h1 { font-size:26px; margin:0 0 12px; color:#00b4d8; }
#startOverlay p  { font-size:16px; opacity:0.7; margin:0; }
</style>
</head>
<body>

<div id="startOverlay">
  <h1>タップしてスタート</h1>
  <p>SCREEN 5 (CUSTOMER)</p>
</div>

<!-- 上部 1/4：カスタマーディスプレイ起動枠 -->
<div id="customer-top">
  <div id="customer-top-inner">
    <p id="customer-top-title">お会計・金額表示を開く</p>
    <p id="customer-top-sub">タップで 192.168.0.115:55556 を表示</p>
  </div>
</div>

<!-- 下部 3/4：サイネージ・QR・ルーレット -->
<div id="lower-area">
  <div id="stage">
    <div id="banner"></div>
    <div id="bar">
      <button class="btn" id="btn-roulette">ルーレット</button>
    </div>
  </div>

  <div class="overlay" id="qr-overlay">
    <button class="close-btn" id="qr-close">戻る</button>
    <p class="ov-title" id="qr-title">PayPay</p>
    <div id="qr-card"><img id="qr-img" alt="QR"></div>
    <p class="ov-sub">スマートフォンでスキャンしてお支払いください</p>
    <p class="ov-sub">金額は上の画面でご確認ください</p>
  </div>

  <div class="overlay" id="roulette-overlay">
    <button class="close-btn" id="roulette-close">閉じる</button>
    <p class="ov-title" id="roulette-title">ルーレット</p>
    <div id="wheel-wrap"><canvas id="wheel"></canvas></div>
    <button class="btn" id="spin-btn">スタート</button>
    <div id="roulette-result"></div>
  </div>
</div>

<script>
var CONFIG = {
  customerUrl     : 'http://192.168.0.115:55556',
  cycleMs         : 59900,
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qr : { paypay:'qr_paypay.png', nakapay:'qr_nakapay.png' }
};

var PARTS = [
  { id:'p1', src:'calendar.jpg', offset:0     },
  { id:'p2', src:'free1_01.png', offset:10000 },
  { id:'p3', src:'holiday.jpg',  offset:20000 },
  { id:'p4', src:'free2_01.jpg', offset:30000 },
  { id:'p5', src:'event.jpg',    offset:40000 },
  { id:'p6', src:'横長ロゴ.jpg', offset:50000 }
];

document.getElementById('customer-top').addEventListener('click', function() {
  window.location.href = CONFIG.customerUrl;
}, false);

var qrOverlay = document.getElementById('qr-overlay');
var rlOverlay = document.getElementById('roulette-overlay');
var returnTimer = null;

function setOverlayVisible(el, visible) {
  el.style.display = visible ? 'block' : 'none';
}

function closeAll() {
  setOverlayVisible(qrOverlay, false);
  setOverlayVisible(rlOverlay, false);
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
}
function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

function encodeImgSrc(src) {
  return encodeURI(src);
}

new Image().src = encodeImgSrc(CONFIG.qr.paypay);
new Image().src = encodeImgSrc(CONFIG.qr.nakapay);

function showQr(kind, label) {
  closeAll();
  document.getElementById('qr-title').textContent = label;
  document.getElementById('qr-img').src = encodeImgSrc(CONFIG.qr[kind]);
  setOverlayVisible(qrOverlay, true);
  setReturnTimer(CONFIG.qrTimeoutMs);
}

var stage = document.getElementById('stage');
var slideEls = {};
for (var i = 0; i < PARTS.length; i++) {
  var p = PARTS[i];
  var el = document.createElement('div');
  el.className = 'slide';
  el.style.backgroundImage = "url('" + encodeImgSrc(p.src) + "')";
  stage.insertBefore(el, stage.firstChild);
  slideEls[p.id] = el;
}

var started = false, lastPartId = null;

function getPart(offset) {
  for (var j = PARTS.length - 1; j >= 0; j--) {
    if (offset >= PARTS[j].offset) return PARTS[j];
  }
  return PARTS[0];
}

function tick() {
  if (!started) return;
  var part = getPart(new Date().getTime() % CONFIG.cycleMs);
  if (part.id === lastPartId) return;
  lastPartId = part.id;
  for (var k in slideEls) {
    if (slideEls.hasOwnProperty(k)) {
      slideEls[k].style.opacity = (k === part.id) ? '1' : '0';
    }
  }
}
setInterval(tick, 100);

var startOverlay = document.getElementById('startOverlay');
function handleStartTap() {
  if (started) return;
  started = true;
  startOverlay.style.display = 'none';
  tick();
  loadEvents();
}
startOverlay.addEventListener('click', handleStartTap, false);
startOverlay.addEventListener('touchend', function(e) {
  if (e && e.preventDefault) e.preventDefault();
  handleStartTap();
}, false);

function isButtonTarget(target) {
  while (target && target !== document.body) {
    if (target.tagName === 'BUTTON') return true;
    target = target.parentNode;
  }
  return false;
}

var lastSideTapTime = 0;
function handleSideTap(e) {
  if (!started) return;
  if (isButtonTarget(e.target)) return;

  var now = new Date().getTime();
  if (now - lastSideTapTime < 250) return;
  lastSideTapTime = now;

  var x = 0;
  if (typeof e.clientX === 'number' && e.clientX > 0) {
    x = e.clientX;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    x = e.changedTouches[0].clientX;
  } else if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX;
  }

  var w = window.innerWidth || document.documentElement.clientWidth || 320;
  if (x < w / 2) {
    showQr('paypay', 'PayPay');
  } else {
    showQr('nakapay', 'ナカペイ');
  }
}

document.getElementById('qr-close').addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  closeAll();
}, false);

stage.addEventListener('click', handleSideTap, false);
stage.addEventListener('touchend', handleSideTap, false);
qrOverlay.addEventListener('click', handleSideTap, false);
qrOverlay.addEventListener('touchend', handleSideTap, false);

var activeBanners = [];
var bannerIdx = 0;
var activeRoulette = null;
var bannerEl = document.getElementById('banner');
var barEl = document.getElementById('bar');
var btnRoulette = document.getElementById('btn-roulette');

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function parseLines(text) {
  var raw = text.split(/\r?\n/);
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var l = raw[i].replace(/^\s+|\s+$/g, '');
    if (l.length > 0 && l.charAt(0) !== '#' && l.indexOf('|') !== -1) {
      out.push(l);
    }
  }
  return out;
}

function applyEvents(lines) {
  var today = todayStr();
  activeBanners = [];
  activeRoulette = null;

  for (var i = 0; i < lines.length; i++) {
    var cols = lines[i].split('|');
    if (cols.length < 4) continue;
    var start = cols[0].replace(/^\s+|\s+$/g, '');
    var end   = cols[1].replace(/^\s+|\s+$/g, '');
    var type  = cols[2].replace(/^\s+|\s+$/g, '');
    var val   = cols[3].replace(/^\s+|\s+$/g, '');
    if (today >= start && today <= end) {
      if (type === 'banner') activeBanners.push(val);
      if (type === 'roulette') activeRoulette = val;
    }
  }

  if (activeBanners.length > 0) {
    bannerIdx = 0;
    bannerEl.textContent = activeBanners[0];
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  if (activeRoulette) {
    btnRoulette.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(activeRoulette);
  } else {
    btnRoulette.style.display = 'none';
    barEl.style.display = 'none';
  }
}

setInterval(function() {
  if (activeBanners.length > 1) {
    bannerIdx = (bannerIdx + 1) % activeBanners.length;
    bannerEl.textContent = activeBanners[bannerIdx];
  }
}, 5000);

function xhrGet(url, cb) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 0) cb(xhr.responseText || '');
      }
    };
    xhr.send(null);
  } catch (e) {}
}

function loadEvents() {
  xhrGet('events.txt?t=' + new Date().getTime(), function(txt) {
    if (txt) applyEvents(parseLines(txt));
  });
}
setInterval(loadEvents, 60000);

var prizes = ['あたり', 'はずれ', 'もう1回', 'プチ賞'];
var canvas = document.getElementById('wheel');
var ctx = canvas.getContext('2d');
var spinBtn = document.getElementById('spin-btn');
var resultEl = document.getElementById('roulette-result');
var wheelAngle = 0;
var spinning = false;
var wheelColors = ['#c1121f', '#1d3557', '#2a9d8f', '#e9c46a', '#6a4c93', '#f77f00'];

function loadPrizes(filename) {
  xhrGet(filename + '?t=' + new Date().getTime(), function(txt) {
    if (!txt) return;
    var raw = txt.split(/\r?\n/);
    var list = [];
    for (var i = 0; i < raw.length; i++) {
      var s = raw[i].replace(/^\s+|\s+$/g, '');
      if (s.length > 0) list.push(s);
    }
    if (list.length > 0) {
      prizes = list;
      drawWheel(wheelAngle);
    }
  });
}

function resizeWheel() {
  var lower = document.getElementById('lower-area');
  var lw = lower.clientWidth || 320;
  var lh = lower.clientHeight || 360;
  var size = Math.min(Math.floor(lw * 0.65), Math.floor(lh * 0.48), 260);
  if (size < 140) size = 140;
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  drawWheel(wheelAngle);
}

function drawWheel(angle) {
  var size = parseInt(canvas.style.width, 10) || 180;
  var r = size / 2 - 6;
  var cx = size / 2;
  var cy = size / 2;
  var n = prizes.length;
  var arc = (Math.PI * 2) / n;

  ctx.clearRect(0, 0, size, size);

  for (var i = 0; i < n; i++) {
    var startA = angle + i * arc;
    var endA = startA + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startA, endA, false);
    ctx.closePath();
    ctx.fillStyle = wheelColors[i % wheelColors.length];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + arc / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(prizes[i], r - 10, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.moveTo(cx, 2);
  ctx.lineTo(cx - 10, 18);
  ctx.lineTo(cx + 10, 18);
  ctx.closePath();
  ctx.fillStyle = '#ffd700';
  ctx.fill();
}

btnRoulette.addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  closeAll();
  resultEl.textContent = '';
  spinBtn.disabled = false;
  setOverlayVisible(rlOverlay, true);
  resizeWheel();
  setReturnTimer(CONFIG.rouletteIdleMs);
}, false);

document.getElementById('roulette-close').addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  closeAll();
}, false);

spinBtn.addEventListener('click', function(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  if (spinning || prizes.length === 0) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = '';

  var startAngle = wheelAngle;
  var extraSpins = (5 + Math.floor(Math.random() * 4)) * Math.PI * 2;
  var targetAngle = startAngle + extraSpins + Math.random() * Math.PI * 2;
  var duration = 3600;
  var startTime = new Date().getTime();

  var timer = setInterval(function() {
    var elapsed = new Date().getTime() - startTime;
    var t = elapsed / duration;
    if (t > 1) t = 1;
    var easeOut = 1 - Math.pow(1 - t, 3);
    wheelAngle = startAngle + (targetAngle - startAngle) * easeOut;
    drawWheel(wheelAngle);

    if (t >= 1) {
      clearInterval(timer);
      spinning = false;
      spinBtn.disabled = false;
      var n = prizes.length;
      var arc = (Math.PI * 2) / n;
      var pointerAngle = ((-Math.PI / 2 - wheelAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var idx = Math.floor(pointerAngle / arc) % n;
      resultEl.textContent = prizes[idx];
      setReturnTimer(CONFIG.resultTimeoutMs);
    }
  }, 25);
}, false);
</script>
</body>
</html>
