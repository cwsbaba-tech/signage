<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SCREEN 5 - CUSTOMER</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

#stage {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
}

.slide {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  opacity: 0;
  -webkit-transition: opacity 0.6s ease-in-out;
  transition: opacity 0.6s ease-in-out;
}

#tapLeft {
  position: absolute;
  top: 0; bottom: 0; left: 0; width: 50%;
  z-index: 10;
  cursor: pointer;
}
#tapRight {
  position: absolute;
  top: 0; bottom: 0; right: 0; width: 50%;
  z-index: 10;
  cursor: pointer;
}

#banner {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 20;
  padding: 1.6vmin 3vmin;
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  background: rgba(180, 20, 40, 0.88);
  border-bottom: 3px solid #ffd700;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  display: none;
}

#bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  padding: 2vmin 3vmin;
  text-align: center;
  background: rgba(5, 10, 15, 0.88);
  border-top: 3px solid #00b4d8;
  display: none;
}

.btn {
  min-width: 22vmin;
  padding: 1.8vmin 3vmin;
  font-family: inherit;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  border: 2px solid #ffd700;
  border-radius: 2vmin;
  background: #b8860b;
  cursor: pointer;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.92);
  color: #fff;
  text-align: center;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.overlay.show {
  display: flex;
}

.closeBtn {
  position: absolute;
  top: 2vmin; right: 2vmin;
  z-index: 120;
  padding: 1.4vmin 3vmin;
  font-size: 24px;
  font-weight: 700;
  font-family: inherit;
  color: #fff;
  background: #444;
  border: 2px solid #888;
  border-radius: 1.6vmin;
  cursor: pointer;
}

.ovTitle { font-size: 40px; font-weight: 700; margin: 0 0 2vmin; }
.ovSub   { font-size: 24px; color: #caf0f8; margin: 2vmin 0 0; }

#qrCard {
  background: #fff;
  padding: 2.4vmin;
  border-radius: 2vmin;
}
#qrImg {
  display: block;
  width: 360px;
  height: 360px;
  object-fit: contain;
}

#qrLeft {
  position: absolute;
  top: 0; bottom: 0; left: 0; width: 50%;
  z-index: 110;
}
#qrRight {
  position: absolute;
  top: 0; bottom: 0; right: 0; width: 50%;
  z-index: 110;
}

#wheel { display: block; margin: 0 auto; }
#rouletteResult {
  min-height: 6vmin;
  margin-top: 1.6vmin;
  font-size: 36px;
  font-weight: 700;
  color: #ffd700;
}
</style>
</head>
<body>

<div id="stage">
  <div id="tapLeft"></div>
  <div id="tapRight"></div>
  <div id="banner"></div>
  <div id="bar">
    <button class="btn" id="btnRoulette">ルーレット</button>
  </div>
</div>

<div class="overlay" id="qrOverlay">
  <button class="closeBtn" id="qrClose">戻る</button>
  <div id="qrLeft"></div>
  <div id="qrRight"></div>
  <p class="ovTitle" id="qrTitle">PayPay</p>
  <div id="qrCard"><img id="qrImg" src="qr_paypay.png" alt="QR"></div>
  <p class="ovSub">スマートフォンでスキャンしてお支払いください</p>
  <p class="ovSub">金額はレジの画面でご確認ください</p>
</div>

<div class="overlay" id="rouletteOverlay">
  <button class="closeBtn" id="rouletteClose">閉じる</button>
  <p class="ovTitle">ルーレット</p>
  <canvas id="wheel" width="320" height="320"></canvas>
  <div style="margin-top:2vmin;"><button class="btn" id="spinBtn">スタート</button></div>
  <div id="rouletteResult"></div>
</div>

<script>
var CONFIG = {
  cycleMs         : 59900,
  qrTimeoutMs     : 60000,
  rouletteIdleMs  : 90000,
  resultTimeoutMs : 15000,
  qrPaypay        : 'qr_paypay.png',
  qrNakapay       : 'qr_nakapay.png'
};

var stage = document.getElementById('stage');

function createSlide(id, src) {
  var el = document.createElement('div');
  el.id = id;
  el.className = 'slide';
  el.style.backgroundImage = "url('" + src + "')";
  stage.insertBefore(el, stage.firstChild);
  return el;
}

var elP1 = createSlide('p1', 'calendar.jpg');
var elP2 = createSlide('p2', 'free1_01.png');
var elP3 = createSlide('p3', 'holiday.jpg');
var elP4 = createSlide('p4', 'free2_01.jpg');
var elP5 = createSlide('p5', 'event.jpg');
var elP6 = createSlide('p6', '横長ロゴ.jpg');

var lastPartId = '';

function tick() {
  var offset = Date.now() % CONFIG.cycleMs;
  var partId = 'p1';
  if (offset >= 50000) { partId = 'p6'; }
  else if (offset >= 40000) { partId = 'p5'; }
  else if (offset >= 30000) { partId = 'p4'; }
  else if (offset >= 20000) { partId = 'p3'; }
  else if (offset >= 10000) { partId = 'p2'; }

  if (partId === lastPartId) return;
  lastPartId = partId;

  elP1.style.opacity = (partId === 'p1') ? '1' : '0';
  elP2.style.opacity = (partId === 'p2') ? '1' : '0';
  elP3.style.opacity = (partId === 'p3') ? '1' : '0';
  elP4.style.opacity = (partId === 'p4') ? '1' : '0';
  elP5.style.opacity = (partId === 'p5') ? '1' : '0';
  elP6.style.opacity = (partId === 'p6') ? '1' : '0';
}

/* QR事前読み込み */
var preload1 = new Image();
preload1.src = CONFIG.qrPaypay;
var preload2 = new Image();
preload2.src = CONFIG.qrNakapay;

var qrOverlay = document.getElementById('qrOverlay');
var rlOverlay = document.getElementById('rouletteOverlay');
var returnTimer = null;

function closeAll() {
  qrOverlay.classList.remove('show');
  rlOverlay.classList.remove('show');
  if (returnTimer) {
    clearTimeout(returnTimer);
    returnTimer = null;
  }
}

function setReturnTimer(ms) {
  if (returnTimer) clearTimeout(returnTimer);
  returnTimer = setTimeout(closeAll, ms);
}

function showPaypay() {
  closeAll();
  document.getElementById('qrTitle').textContent = 'PayPay';
  document.getElementById('qrImg').src = CONFIG.qrPaypay;
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

function showNakapay() {
  closeAll();
  document.getElementById('qrTitle').textContent = 'ナカペイ';
  document.getElementById('qrImg').src = CONFIG.qrNakapay;
  qrOverlay.classList.add('show');
  setReturnTimer(CONFIG.qrTimeoutMs);
}

document.getElementById('tapLeft').addEventListener('click', showPaypay);
document.getElementById('tapRight').addEventListener('click', showNakapay);
document.getElementById('qrLeft').addEventListener('click', showPaypay);
document.getElementById('qrRight').addEventListener('click', showNakapay);
document.getElementById('qrClose').addEventListener('click', closeAll);

/* イベント読み込み（events.txt） */
var prizeFile = '';

function pad2(n) {
  return (n < 10) ? ('0' + n) : ('' + n);
}

function getToday() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function parseEvents(rawText) {
  var today = getToday();
  var lines = rawText.split('\n');
  var firstBanner = '';
  prizeFile = '';

  for (var i = 0; i < lines.length; i++) {
    var line = lines.slice(i, i + 1).join('').trim();
    if (line.length === 0) continue;
    if (line.charAt(0) === '#') continue;

    var p1 = line.indexOf('|');
    if (p1 === -1) continue;
    var p2 = line.indexOf('|', p1 + 1);
    if (p2 === -1) continue;
    var p3 = line.indexOf('|', p2 + 1);
    if (p3 === -1) continue;

    var start = line.substring(0, p1).trim();
    var end   = line.substring(p1 + 1, p2).trim();
    var type  = line.substring(p2 + 1, p3).trim();
    var val   = line.substring(p3 + 1).trim();

    if (today >= start && today <= end) {
      if (type === 'banner' && firstBanner === '') {
        firstBanner = val;
      }
      if (type === 'roulette') {
        prizeFile = val;
      }
    }
  }

  var bannerEl = document.getElementById('banner');
  if (firstBanner !== '') {
    bannerEl.textContent = firstBanner;
    bannerEl.style.display = 'block';
  } else {
    bannerEl.style.display = 'none';
  }

  var barEl = document.getElementById('bar');
  var btnEl = document.getElementById('btnRoulette');
  if (prizeFile !== '') {
    btnEl.style.display = 'inline-block';
    barEl.style.display = 'block';
    loadPrizes(prizeFile);
  } else {
    btnEl.style.display = 'none';
    barEl.style.display = 'none';
  }
}

function loadEvents() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'events.txt?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 0) {
          if (xhr.responseText) {
            parseEvents(xhr.responseText);
          }
        }
      }
    };
    xhr.send();
  } catch (e) {}
}

/* ルーレット処理 */
var prizesData = '1等|||2等|||3等|||参加賞';
var prizeCount = 4;
var currentAngle = 0;
var spinning = false;

function getPrizeAt(idx) {
  var parts = prizesData.split('|||');
  return parts.slice(idx, idx + 1).join('');
}

function getColorAt(idx) {
  var mod = idx % 6;
  if (mod === 0) return '#e63946';
  if (mod === 1) return '#457b9d';
  if (mod === 2) return '#2a9d8f';
  if (mod === 3) return '#e9c46a';
  if (mod === 4) return '#f4a261';
  return '#8338ec';
}

function loadPrizes(file) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', file + '?t=' + Date.now(), true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 0) {
          if (xhr.responseText) {
            var lines = xhr.responseText.split('\n');
            var joined = '';
            var c = 0;
            for (var i = 0; i < lines.length; i++) {
              var s = lines.slice(i, i + 1).join('').trim();
              if (s.length > 0 && s.charAt(0) !== '#') {
                if (c > 0) joined += '|||';
